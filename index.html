<style>

const SETUP_KEY='tt_v36_setup',STATE_KEY='tt_v36_state',SESSION_KEY='tt_v36_session';

const ROOM_KEY='tt_v4_room';
const SUPABASE_URL=String(window.M1_SUPABASE_CONFIG?.url||'').trim();
const SUPABASE_PUBLISHABLE_KEY=String(window.M1_SUPABASE_CONFIG?.publishableKey||'').trim();

let ACCESS_MODE=sessionStorage.getItem(ACCESS_MODE_KEY)||null;

function setAccessMode(mode){ACCESS_MODE=mode||null;if(mode)sessionStorage.setItem(ACCESS_MODE_KEY,mode);else sessionStorage.removeItem(ACCESS_MODE_KEY)}
function clearAdminAccess(){ADMIN_TOKEN=null;sessionStorage.removeItem(ADMIN_TOKEN_KEY);if(ACCESS_MODE==='admin')setAccessMode(null)}

const MEMBER_TOKENS_KEY='tt_v42_member_tokens';
let ROOM_SIGNAL_POLL=null,NEG_HISTORY_TIMER=null;
function memberTokenMap(){try{return JSON.parse(localStorage.getItem(MEMBER_TOKENS_KEY)||'{}')}catch(e){return{}}}
function memberTokenForRoom(code){const m=memberTokenMap();return code?m[String(code).toUpperCase()]||null:null}
function setMemberTokenForRoom(code,token){if(!code||!token)return;const m=memberTokenMap();m[String(code).toUpperCase()]=token;localStorage.setItem(MEMBER_TOKENS_KEY,JSON.stringify(m))}
function currentMemberToken(){return memberTokenForRoom(ROOM?.code||roomInfo()?.code)}
async function claimLockedRole(role,name=null){
  if(!ROOM?.code||!SB)throw new Error('Chưa vào phòng game.');
  const existing=currentMemberToken();
  const {data,error}=await SB.rpc('claim_game_role',{p_room_code:ROOM.code,p_role:role,p_player_name:name,p_existing_token:existing});
  if(error){
    const msg=String(error.message||'');
    if(msg.includes('PLAYER_ALREADY_CLAIMED'))throw new Error('Người chơi này đã được thiết bị khác chọn. Hãy chọn đúng người của bạn hoặc liên hệ Admin.');
    throw error;
  }
  const row=Array.isArray(data)?data[0]:data;if(!row)throw new Error('Không thể khóa vai trò.');
  setMemberTokenForRoom(ROOM.code,row.member_token);
  if(row.role==='player')return{role:'player',name:row.player_name};
  return{role:'observer'};
}
async function restoreLockedMemberSession(){
  if(accessIsAdmin()||ACCESS_MODE!=='player'||!ROOM?.code||!SB)return false;
  const tok=currentMemberToken();if(!tok)return false;
  const {data,error}=await SB.rpc('resume_game_role',{p_room_code:ROOM.code,p_member_token:tok});
  if(error)return false;const row=Array.isArray(data)?data[0]:data;if(!row)return false;
  session=row.role==='player'?{role:'player',name:row.player_name}:{role:'observer'};
  sessionStorage.setItem(SESSION_KEY,JSON.stringify(session));return true;
}


function roomInfo(){
  try{return JSON.parse(localStorage.getItem(ROOM_KEY)||'null')}catch(e){return null}
}
function storeRoom(x){
  ROOM=x||null;

  else localStorage.removeItem(ROOM_KEY);
}

  ROOM_STATUS=x;

    el.className='room-dot '+(x==='live'?'live':x==='sync'?'sync':x==='error'?'error':'');
  });
  document.querySelectorAll('[data-room-status]').forEach(el=>{
    el.textContent=x==='live'?'ĐỒNG BỘ REALTIME':x==='sync'?'ĐANG ĐỒNG BỘ':x==='error'?'LỖI KẾT NỐI':'CHƯA VÀO PHÒNG';
  });
}
function makeRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='';
  for(let i=0;i<6;i++)out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function roomUrl(code){
  const u=new URL(location.href);
  u.searchParams.set('room',code);
  return u.toString();
}
function applyRemoteState(st,revision){
  if(!st||typeof st!=='object')return;
  localStorage.setItem(STATE_KEY,JSON.stringify(st));
  if(st.setup)saveSetup(st.setup);
  if(ROOM){
    ROOM.revision=Number(revision)||ROOM.revision||0;
    storeRoom(ROOM);
  }
  window.dispatchEvent(new Event('tt-state'));
}
async function fetchRoomLatest(signal){
  if(!SB||!ROOM?.id)return null;
  const requestRoomId=ROOM.id,requestCode=ROOM.code,requestAdmin=accessIsAdmin();
  const requestCredential=requestAdmin?ADMIN_TOKEN:currentMemberToken();
  const fetchDiag=window.__G526_FETCH_DIAG__;
  const fetchDiagId=typeof fetchDiag?.begin==='function'?fetchDiag.begin({role_admin:requestAdmin,credential_present:!!requestCredential,revision_before:Number(ROOM.revision)||0}):null;
  const traceFetch=(event,fields={})=>{try{fetchDiag?.record(fetchDiagId,event,fields)}catch{}};
  let data,error;
  const readRpc = (name, args) => {
    const query = SB.rpc(name, args);
    if (signal) {
      if (typeof query?.abortSignal !== 'function') { const unsupported = new Error('ROOM_READ_ABORT_UNSUPPORTED'); unsupported.code = 'ROOM_READ_ABORT_UNSUPPORTED'; throw unsupported; }
      return query.abortSignal(signal);
    }
    return query;
  };
  try{
    if(requestAdmin)({data,error}=await readRpc('fetch_game_room_state_secure',{p_room_id:requestRoomId,p_member_token:null,p_admin_token:requestCredential}));
    else if(requestCredential)({data,error}=await readRpc('fetch_game_room_state_secure',{p_room_id:requestRoomId,p_member_token:requestCredential,p_admin_token:null}));

  if(!s.timer)s.timer=defaultTimer();if(!s.timer.autoPassed)s.timer.autoPassed={};
  if(!s.snapshots)s.snapshots={};
  if(!s.roundTimerHistory)s.roundTimerHistory={};
  if(!('endedAtRound' in s))s.endedAtRound=null;
  if(!('gameStartedAt' in s))s.gameStartedAt=s.setup?.startedAt||null;
  if(!('gameEndedAt' in s))s.gameEndedAt=null;
  if(s.clockV362!==true){const oldStart=s.gameStartedAt||s.setup?.startedAt||null,oldEnd=s.gameEndedAt||Date.now();s.activeElapsedMs=oldStart?Math.max(0,oldEnd-oldStart):0;s.activeSince=s.timer?.running&&!s.gameOver?Date.now():null;s.clockV362=true}else{if(!Number.isFinite(Number(s.activeElapsedMs)))s.activeElapsedMs=0;if(!('activeSince' in s))s.activeSince=null;if(s.timer?.running&&!s.activeSince&&!s.gameOver)s.activeSince=Date.now();if((!s.timer?.running||s.gameOver)&&s.activeSince)pauseGameClock(s)}
  if(!s.branchMarket)s.branchMarket={enabled:!!s.setup?.branchEnabled,price:Math.max(0,Number(s.setup?.branchStartPrice??DEFAULT_BRANCH_PRICE)),lastPriceBumpActiveMs:activeElapsedMsNow(s),frozen:false};if(typeof s.branchMarket.frozen!=='boolean')s.branchMarket.frozen=false;if(!Number.isFinite(Number(s.branchMarket.lastPriceBumpActiveMs)))s.branchMarket.lastPriceBumpActiveMs=activeElapsedMsNow(s);
  if(!Array.isArray(s.trades))s.trades=[];
  s.trades=s.trades.map(t=>{
    if(t.schema===2){
      if(!t.responses)t.responses={};
      return t;
    }
    const id=Number(t.id)||0;
    const mapped=t.status==='accepted'?'accepted':t.status==='declined'?'declined':'pending';
    return{
      schema:2,id,rootId:id,round:t.round||1,mode:'direct',originType:'buy',
      initiator:t.from,target:t.to,res:t.res,qty:Number(t.qty)||1,price:Number(t.money)||0,
      proposer:t.from,recipient:t.to,buyer:t.from,seller:t.to,stage:'root',
      status:mapped,responses:{},branchWith:t.to||null,createdAt:id
    };
  });
  const maxId=s.trades.reduce((m,t)=>Math.max(m,Number(t.id)||0),0);
  if(!s.seq||s.seq<=maxId)s.seq=maxId+1;
  for(const p of Object.values(s.players||{})){
    if(typeof p.declinedProject!=='boolean')p.declinedProject=false;
    if(!p.refill||!Object.keys(p.refill).length){const own=p.businessId&&RESOURCE_KEYS.includes(p.businessId)?p.businessId:Object.entries(p.res||{}).sort((a,b)=>b[1]-a[1])[0]?.[0];p.refill=own?{[own]:3}:{}}
    if(!Array.isArray(p.branches))p.branches=[];for(const b of p.branches){if(!Number.isFinite(Number(b.boughtAtActiveMs)))b.boughtAtActiveMs=activeElapsedMsNow(s);}
  }
  if(!s.setup)s.setup={players:Object.entries(s.players||{}).map(([name,p],i)=>({name,businessId:p.businessId||BUSINESS_CATALOG[i%BUSINESS_CATALOG.length].id}))};s.setup=normalizeSetup(s.setup);
  if(!s.markets)s.markets=buildScenarioMarkets(s.setup||{players:Object.entries(s.players||{}).map(([name,p],i)=>({name,businessId:p.businessId||BUSINESS_CATALOG[i%BUSINESS_CATALOG.length].id}))});
  if(!s.snapshots['1']&&s.round===1)s.snapshots['1']=makeRoundSnapshot(s);
  return s
}

    .map(([k,v])=>({k,need:v,have:pl.res[k]||0,missing:Math.max(0,v-(pl.res[k]||0))}))
    .filter(x=>x.missing>0)
}

function bindEntry(){
  const adminBtn=document.getElementById('adminLoginBtn');
  if(adminBtn)adminBtn.onclick=async()=>{
    const user=String(document.getElementById('adminUserInput')?.value||'').trim().toUpperCase();
    const pass=String(document.getElementById('adminPassInput')?.value||'');
    if(user!=='ADMIN'){showAccessError('adminAccessError','Tài khoản Admin không đúng.');return}
    if(!pass){showAccessError('adminAccessError','Nhập mật khẩu Admin.');return}
    adminBtn.disabled=true;adminBtn.textContent='ĐANG XÁC THỰC...';
    try{
      try{sessionStorage.setItem('G526_ADMIN_LOGIN_DIAGNOSTIC',JSON.stringify({version:'g526-admin-diagnostic-v1',rpc:'admin_login',at:new Date().toISOString(),outcome:'RPC_RESULT_UNKNOWN',httpStatus:'UNKNOWN',errorCode:'UNKNOWN',dataPresent:'UNKNOWN',loginDataTruthy:'UNKNOWN'}))}catch(_diagnosticStorageError){}
      const {data,error,status}=await SB.rpc('admin_login',{p_password:pass});
      // Store only allowlisted diagnostics; never response content or credentials.
      const safeCode=typeof error?.code==='string'&&/^(?:[0-9A-Z]{5}|PGRST[0-9]{3})$/.test(error.code)?error.code:'UNKNOWN';
      try{sessionStorage.setItem('G526_ADMIN_LOGIN_DIAGNOSTIC',JSON.stringify({version:'g526-admin-diagnostic-v1',rpc:'admin_login',at:new Date().toISOString(),outcome:error?'RPC_ERROR':!data?'EMPTY_RESULT':'DATA_PRESENT',httpStatus:Number.isInteger(status)&&status>=100&&status<=599?status:'UNKNOWN',errorCode:safeCode,dataPresent:data!==null&&data!==undefined,loginDataTruthy:!!data}))}catch(_diagnosticStorageError){}
      if(error)throw new Error('Sai mật khẩu Admin.');
      if(!data)throw new Error('Sai mật khẩu Admin.');
      ADMIN_TOKEN=data;sessionStorage.setItem(ADMIN_TOKEN_KEY,ADMIN_TOKEN);setAccessMode('admin');session=null;sessionStorage.removeItem(SESSION_KEY);render();
    }catch(e){showAccessError('adminAccessError',e?.message==='Sai mật khẩu Admin.'?e.message:'Không đăng nhập được Admin. Kiểm tra mật khẩu hoặc mạng.');adminBtn.disabled=false;adminBtn.textContent='ĐĂNG NHẬP ADMIN'}
  };
  const pass=document.getElementById('adminPassInput');if(pass)pass.addEventListener('keydown',e=>{if(e.key==='Enter')adminBtn?.click()});
  const joinBtn=document.getElementById('entryJoinBtn');
  if(joinBtn)joinBtn.onclick=async()=>{
    const code=String(document.getElementById('entryRoomCode')?.value||'').trim().toUpperCase();
    if(!code){showAccessError('playerAccessError','Nhập mã game do Admin cung cấp.');return}
    joinBtn.disabled=true;joinBtn.textContent='ĐANG VÀO GAME...';setAccessMode('player');
    try{await joinOnlineRoom(code,true);session=null;sessionStorage.removeItem(SESSION_KEY);render()}
    catch(e){setAccessMode(null);storeRoom(null);ROOM=null;showAccessError('playerAccessError',e?.message||'Mã game không hợp lệ.');joinBtn.disabled=false;joinBtn.textContent='VÀO GAME'}
  };
  const code=document.getElementById('entryRoomCode');if(code)code.addEventListener('keydown',e=>{if(e.key==='Enter')joinBtn?.click()});
}

function projectCard(p,s,opt={}){const tokens=Object.entries(s.players).filter(([,pl])=>pl.target===p.id).map(([n,pl])=>`<span class="token">${n}${pl.locked?' 🔒':''}</span>`).join('');const sel=opt.name&&s.players[opt.name].target===p.id;const locked=opt.name&&s.players[opt.name].locked&&sel;const win=s.results.find(r=>r.round===s.round&&r.projectId===p.id&&r.winner);const cls=`project ${opt.clickable?'clickable':''} ${sel?'selected':''} ${locked?'locked':''} ${win?'winner':''}`;return`<div class="${cls}" ${opt.clickable?`data-project="${p.id}"`:''}>${sel?'<div class="check">✓</div>':''}<div class="split"><b>${p.id}</b><span class="badge">${p.reward}M</span></div><div style="font-weight:850;margin-top:6px">${p.name}</div><div class="need">${needText(p.need)}</div><div class="tokens">${tokens||'<span class="muted tiny">Chưa có người chọn</span>'}</div>${opt.clickable?`<div class="interaction-hint">${sel?'✓ ĐÃ CHỌN':'👆 Bấm khối này để chọn'}</div>`:''}${win?`<div class="success" style="margin-top:8px">🏆 ${win.winner} thắng dự án</div>`:''}</div>`}

function timerCard(s,host=false){
  const rem=remainingTime(s),running=s.timer.running,expired=s.timer.expired||rem<=0;
  return`<div class="card timer-card ${running?'running':''} ${expired?'expired':''}">
    <div class="split">
      <div><div class="title">⏱️ Đồng hồ Vòng ${s.round}</div><div class="muted">Mặc định 12 phút · hết giờ sẽ đóng thị trường về P4 nếu còn ở P1–P3.</div></div>
      <span class="badge">${running?'ĐANG CHẠY':expired?'HẾT GIỜ':'ĐANG DỪNG'}</span>
    </div>
    <div id="timerText" class="timer-display ${expired?'expired':''}" style="margin:10px 0">${fmtTime(rem)}</div>
    ${host?`
      <div class="manual-time-box">
        <div class="muted"><b>Nhập thời gian thủ công</b> — định dạng phút:giây, ví dụ <b>7:30</b>. Có thể xóa và gõ lại bằng bàn phím.</div>
        <div class="manual-time-row">
          <div class="field" style="margin:7px 0 0"><label>Thời gian</label><input id="manualTimerInput" type="text" inputmode="numeric" autocomplete="off" value="${fmtTime(rem)}" placeholder="MM:SS"></div>
          <button class="btn secondary" id="applyManualTimer">ÁP DỤNG</button>
          <button class="btn bad" id="timerSetZero">ĐẶT 0:00</button>
        </div>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="control-tile timerPreset ${s.timer.duration===480?'selected':''}" data-sec="480">8 phút</button>
        <button class="control-tile timerPreset ${s.timer.duration===600?'selected':''}" data-sec="600">10 phút</button>
        <button class="control-tile timerPreset ${s.timer.duration===720?'selected':''}" data-sec="720">12 phút</button>
        <button class="control-tile timerPreset ${s.timer.duration===900?'selected':''}" data-sec="900">15 phút</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ${running?'warn':'good'}" id="timerToggle">${running?'⏸ DỪNG':'▶ BẮT ĐẦU'}</button>
        <button class="btn secondary timerExtend" data-sec="30">+30s</button>
        <button class="btn secondary timerExtend" data-sec="60">+1 phút</button>
        <button class="btn secondary timerExtend" data-sec="120">+2 phút</button>
        <button class="btn bad" id="timerEndNow">HẾT GIỜ NGAY</button>
      </div>`:''}
    <div class="timeline">${Object.keys(PHASES).map(p=>`<div class="time-mark ${p===s.phase?'active':''}"><b>${p}</b><span>${PHASE_MARKS[p]}</span></div>`).join('')}</div>
  </div>`
}

function currentMarketMetrics(s){const supply=playerSupply(s.players),demand=projectDemand(projects(s)),rows=marketPriceRowsFrom(supply,demand,Object.keys(s.players).length);return{supply,demand,rows}}
function projectRewardRange(s,p){return rewardRangeFrom(p.need,currentMarketMetrics(s).rows)}
function marketAudit(s){const m=currentMarketMetrics(s),bad=m.rows.filter(x=>x.demand>x.supply);return{...m,bad,ok:bad.length===0}}
function hostMarketMeter(s){const a=marketAudit(s);return`<div class="card"><div class="split"><div class="title">📊 Tỉ giá tài nguyên — realtime</div><span class="badge">${Object.keys(s.players).length} người</span></div>${a.ok?'<div class="scenario-ok">✅ Tổng nhu cầu của các dự án hiện tại không vượt tổng nguồn cung đang có.</div>':`<div class="scenario-warn">⚠️ Có ${a.bad.length} loại tài nguyên có tổng cầu vượt tổng cung. Host vẫn được quyền giữ cấu hình này, nhưng không thể hoàn thành toàn bộ dự án cùng lúc.</div>`}<div style="overflow:auto;margin-top:8px"><table><thead><tr><th>Tài nguyên</th><th>Nguồn cung S</th><th>Nhu cầu D</th><th>D/S</th><th>Giá tham chiếu</th></tr></thead><tbody>${a.rows.map(x=>`<tr><td><b>${RES[x.k].icon} ${RES[x.k].label}</b></td><td>${x.supply}</td><td>${x.demand}</td><td>${x.ratio===Infinity?'∞':x.ratio.toFixed(2)}</td><td><span class="market-price ${x.ratio>1?'hot':x.ratio<.7?'cool':'mid'}">${x.price}M</span></td></tr>`).join('')}</tbody></table></div><div class="market-formula"><b>Công thức giá tham chiếu:</b> 10M × ((D + 0,5N) / (S + 0,5N)) × hệ số hoạt động theo số người; giới hạn 4–50M/đơn vị. Trong đó <b>S</b> là tổng số đơn vị sản phẩm đang nằm trong tay toàn bộ người chơi, <b>D</b> là tổng số đơn vị sản phẩm mà các dự án đang mở yêu cầu, <b>N</b> là số người chơi. Giá tự cập nhật khi tổng nguồn cung thay đổi (ví dụ sau khi dự án tiêu hao sản phẩm), khi Host sửa dự án và khi chuyển sang thị trường mới.</div></div>`}
function hostProjectEditor(p,s){const m=currentMarketMetrics(s),range=projectRewardRange(s,p),editable=['P1','P2','P3','P4'].includes(s.phase),active=activeResourceKeys(s),included=active.filter(k=>(p.need[k]||0)>0),available=active.filter(k=>!(p.need[k]||0)),impossible=Object.entries(p.need).some(([k,v])=>v>(m.supply[k]||0)),outside=p.reward<range.min||p.reward>range.max,tokens=Object.entries(s.players).filter(([,pl])=>pl.target===p.id).map(([n,pl])=>`<span class="token">${esc(n)}${pl.locked?' 🔒':''}</span>`).join(''),win=s.results.find(r=>r.round===s.round&&r.projectId===p.id&&r.winner);return`<div class="host-project-editor ${impossible?'impossible':''}"><div class="split"><div><div class="tiny muted">${p.id}</div><div class="editor-title">${p.name}</div></div><span class="badge">${p.reward}M</span></div><div class="tokens" style="margin-top:7px">${tokens||'<span class="muted tiny">Chưa có người chọn</span>'}</div>${win?`<div class="success" style="margin-top:7px">🏆 ${esc(win.winner)} thắng dự án</div>`:''}<div class="ingredient-editor">${included.map(k=>`<div class="ingredient-row"><div><b>${RES[k].icon} ${RES[k].label}</b><div class="supply-badge">Tổng cung hiện tại: ${m.supply[k]||0}</div></div><button class="mini-btn needAdjust" data-pid="${p.id}" data-res="${k}" data-delta="-1" ${!editable?'disabled':''}>−</button><div class="qty">${p.need[k]||0}</div><button class="mini-btn needAdjust" data-pid="${p.id}" data-res="${k}" data-delta="1" ${!editable?'disabled':''}>+</button></div>`).join('')}</div>${available.length&&editable?`<div class="reward-editor"><select class="addResourceSelect" data-pid="${p.id}">${available.map(k=>`<option value="${k}">${RES[k].icon} ${RES[k].label}</option>`).join('')}</select><button class="btn secondary addProjectResource" data-pid="${p.id}">+ THÊM THÀNH PHẦN</button></div>`:''}<div class="price-range ${outside?'warn':''}"><b>Định giá đề xuất:</b> ${range.min}–${range.max}M · Chi phí tài nguyên tham chiếu ≈ ${range.input}M.${outside?' Giá hiện tại nằm ngoài khoảng đề xuất; Host vẫn có toàn quyền giữ giá này.':''}</div><div class="reward-editor"><input class="projectRewardInput" data-pid="${p.id}" type="number" min="0" step="1" value="${p.reward}" ${!editable?'disabled':''}><button class="btn secondary applyProjectReward" data-pid="${p.id}" ${!editable?'disabled':''}>ÁP DỤNG GIÁ</button></div>${impossible?'<div class="danger" style="margin-top:8px">⚠️ Ít nhất một thành phần của riêng dự án này đang lớn hơn tổng nguồn cung hiện có.</div>':''}${!editable?'<div class="muted tiny" style="margin-top:8px">Sửa dự án được khóa từ P5 để bảo toàn kết quả. Host có thể quay lại P4 nếu cần chỉnh.</div>':''}</div>`}
function addProjectResource(pid,key){const s=load();if(!['P1','P2','P3','P4'].includes(s.phase)||!activeResourceKeys(s).includes(key))return;const p=projectById(s,pid);if(!p)return;p.need[key]=(p.need[key]||0)+1;resetProjectDecisionAfterEdit(s,pid,true);logPush(s,`Host thêm ${RES[key].label} vào ${pid}.`);save(s);render()}
function resetProjectDecisionAfterEdit(s,pid,needChanged){if(!needChanged)return;for(const pl of Object.values(s.players)){if(pl.target===pid){pl.bid=null;if(pl.locked&&!enough(pl,projectById(s,pid).need))pl.locked=false}}s.results=s.results.filter(r=>!(r.round===s.round&&r.projectId===pid))}
function adjustProjectNeed(pid,key,delta){const s=load();if(!['P1','P2','P3','P4'].includes(s.phase))return;const p=projectById(s,pid);if(!p||!activeResourceKeys(s).includes(key))return;const next=Math.max(0,(Number(p.need[key])||0)+Number(delta||0));if(next===p.need[key])return;const totalAfter=sumRes(p.need)-(p.need[key]||0)+next;if(totalAfter<1)return;p.need[key]=next;resetProjectDecisionAfterEdit(s,pid,true);logPush(s,`Host chỉnh ${pid}: ${RES[key].label} = ${next}.`);save(s);render()}
function applyProjectReward(pid,value){const s=load();if(!['P1','P2','P3','P4'].includes(s.phase))return;const p=projectById(s,pid),v=Number(value);if(!p||!Number.isFinite(v)||v<0)return;p.reward=Math.round(v);logPush(s,`Host định giá ${pid} = ${p.reward}M.`);save(s);render()}
function hostSecretsCard(s){const show=!!session?.showHostSecrets;const rows=currentMarketMetrics(s).rows||[];const prices=Object.fromEntries(rows.map(x=>[x.k,x.price]));return`<div class="card"><div class="split"><div><div class="title" style="margin:0">Tài chính & tồn kho người chơi</div><div class="muted">Host chủ động bật/tắt. Khi ẩn, các thông tin này không xuất hiện trên dashboard.</div></div><button class="btn ${show?'warn':'secondary'}" id="toggleHostSecrets">${show?'🙈 ẨN THÔNG TIN':'👁️ HIỆN TÀI CHÍNH / TỒN KHO'}</button></div>${show?`<div class="host-secret-grid">${Object.entries(s.players).map(([n,p])=>{const inv=RESOURCE_KEYS.filter(k=>(p.res[k]||0)>0);const ref=RESOURCE_KEYS.reduce((t,k)=>t+(p.res[k]||0)*(prices[k]||10),0);const br=branchSummary(p);return`<div class="host-secret-card"><div class="split"><b>${esc(n)}</b><span class="badge">${p.company}</span></div><div class="secret-money">${p.money}M</div><div class="secret-value">Tồn kho tham chiếu ≈ ${Math.round(ref)}M · Tổng ≈ ${Math.round(ref+p.money)}M</div><div class="inventory-chips">${inv.length?inv.map(k=>`<span class="inventory-chip">${RES[k].icon} ${RES[k].label} ×${p.res[k]}</span>`).join(''):'<span class="muted tiny">Không còn tài nguyên</span>'}</div>${Object.keys(br).length?`<div class="branch-rule"><b>Chi nhánh:</b> ${Object.entries(br).map(([k,v])=>`${RES[k].icon}${RES[k].label} ×${v}`).join(' · ')}</div>`:''}</div>`}).join('')}</div>`:'<div class="footer-note">Đang ẩn tiền, tồn kho và giá trị tài sản tham chiếu.</div>'}</div>`}
function branchMarketHostCard(s){if(!s.branchMarket?.enabled)return'';const next=branchNextIncreaseSeconds(s),sold=s.branchMarket.price<=0,frozen=!!s.branchMarket.frozen,status=frozen?'ĐÓNG BĂNG':sold?'HẾT HÀNG':'ĐANG MỞ';return`<div class="card branch-market-card"><div class="split"><div><div class="title" style="margin:0">🏪 Thị trường chi nhánh</div><div class="muted">Mua chỉ mở ở P1–P3. Chi nhánh không thể bán lại.</div></div><span class="badge">${status}</span></div><div class="branch-price ${sold?'sold-out':''}">${sold?'HẾT HÀNG':s.branchMarket.price+'M / chi nhánh'}</div>${frozen?'<div class="branch-freeze-note" style="margin:7px 0">❄️ Host đang đóng băng bán chi nhánh. Người chơi không thể mua mới; chi nhánh đã sở hữu vẫn sản xuất khi realtime chạy.</div>':''}<div class="branch-controls"><div class="field" style="margin:0"><label>Host đặt giá tuyệt đối (M)</label><input id="branchPriceInput" type="number" min="0" step="10" value="${s.branchMarket.price}"></div><button class="btn secondary branchPriceDelta" data-delta="-10">−10M</button><button class="btn secondary branchPriceDelta" data-delta="10">+10M</button></div><button class="btn secondary big" id="applyBranchPrice" style="margin-top:7px">ÁP DỤNG GIÁ</button><button class="btn ${frozen?'good':'warn'} big" id="toggleBranchFreeze" style="margin-top:7px">${frozen?'▶ TIẾP TỤC BÁN CHI NHÁNH':'❄️ ĐÓNG BĂNG BÁN CHI NHÁNH'}</button><div class="branch-rule">Nếu giá = <b>0M</b>: báo hết hàng. Khi giá >0 và không đóng băng, cứ sau <b>5 phút realtime đang chạy</b> hệ thống tự +${BRANCH_PRICE_STEP}M. ${next!==null?`Lần tăng tiếp theo sau khoảng <b>${fmtTime(next)}</b>.`:frozen?'Chu kỳ tăng giá đang tạm dừng vì thị trường bị đóng băng.':''}</div><div class="branch-rule"><b>Cân bằng mặc định:</b> ${DEFAULT_BRANCH_PRICE}M. Nhánh đúng thế mạnh: 1 nhánh → +1 nguyên liệu/phút. Nhánh ngoài thế mạnh: mua theo cụm 3, mỗi 3 nhánh → +2 nguyên liệu/3 phút.</div></div>`}
function branchPurchaseCard(name,s){if(!s.branchMarket?.enabled)return'';const p=s.players[name],phaseOpen=['P1','P2','P3'].includes(s.phase),sold=s.branchMarket.price<=0,frozen=!!s.branchMarket.frozen,open=phaseOpen&&!sold&&!frozen,active=activeSetupResources(s),summary=branchSummary(p);return`<div class="card branch-card ${frozen?'frozen':''}"><div class="split"><div><div class="title" style="margin:0">🏪 Mua thêm chi nhánh</div><div class="muted">Không thể bán lại · số lượng sở hữu không giới hạn</div></div><span class="badge">${frozen?'❄️ ĐÓNG BĂNG':open?'CÓ THỂ MUA':sold?'HẾT HÀNG':'ĐANG KHÓA'}</span></div><div class="branch-grid">${Object.entries(summary).length?Object.entries(summary).map(([k,v])=>`<div class="branch-chip"><b>${RES[k].icon} ${RES[k].label} ×${v}</b><br>${k===p.businessId?'+1 đơn vị/phút/nhánh':'+2 đơn vị/3 phút mỗi cụm 3'}</div>`).join(''):'<div class="muted tiny">Bạn chưa có chi nhánh nào.</div>'}</div>${open?`<div class="branch-buy-grid" style="margin-top:10px"><div class="field" style="margin:0"><label>Loại chi nhánh</label><select id="branchRes">${active.map(k=>`<option value="${k}">${RES[k].icon} ${RES[k].label}${k===p.businessId?' — THẾ MẠNH':''}</option>`).join('')}</select></div><div class="field" style="margin:0"><label>Số lượng</label><input id="branchQty" type="number" min="1" step="1" value="1"></div></div><div class="notice" id="branchBuyHint" style="margin-top:8px">Giá hiện tại: <b>${s.branchMarket.price}M/chi nhánh</b>. Chi nhánh đúng thế mạnh mua từng chiếc.</div><button class="btn big" id="buyBranch" style="margin-top:8px">MUA CHI NHÁNH</button>`:`<div class="branch-locked" style="margin-top:9px">${frozen?'❄️ Host đang <b>đóng băng bán chi nhánh</b>. Không ai có thể mua thêm cho tới khi Host bấm TIẾP TỤC BÁN CHI NHÁNH.':sold?'Host đang đặt giá 0M → thị trường chi nhánh hết hàng.':'P4–P7 không được mua thêm chi nhánh. Các chi nhánh đã sở hữu vẫn tiếp tục sản sinh tài nguyên khi realtime chạy.'}</div>`}</div>`}
function observerRateCard(s){const a=marketAudit(s);return`<div class="card observer-card"><div class="split"><div class="title" style="margin:0">📊 Tỉ giá thị trường</div><span class="badge">Realtime</span></div><div class="observer-scroll"><table class="observer-table"><thead><tr><th>SP</th><th>Cung</th><th>Cầu</th><th>Giá</th></tr></thead><tbody>${a.rows.map(x=>`<tr><td>${RES[x.k].icon} <b>${RES[x.k].label}</b></td><td>${x.supply}</td><td>${x.demand}</td><td><b>${x.price}M</b></td></tr>`).join('')}</tbody></table></div></div>`}
function observerBranchesCard(s){if(!s.branchMarket?.enabled)return'';const owners=Object.entries(s.players).filter(([,p])=>branchCount(p)>0);return`<div class="card observer-card"><div class="split"><div class="title">🏪 Thẻ chi nhánh đang sở hữu</div><span class="badge">${owners.length} người có chi nhánh</span></div>${owners.length?`<div class="observer-branch-list">${owners.map(([n,p])=>{const br=branchSummary(p);return`<div class="observer-branch-ticket"><b>${esc(n)} · ${p.company}</b>${Object.entries(br).map(([k,v])=>`<div class="tiny">${RES[k].icon} ${RES[k].label} ×${v} · ${k===p.businessId?`+${v}/phút`:`+${Math.floor(v/3)*2}/3 phút`}</div>`).join('')}</div>`}).join('')}</div>`:'<div class="muted">Chưa có người chơi nào mua chi nhánh.</div>'}</div>`}
function observerView(){const s=load();if(s.gameOver)return finalView(s,'observer');const recent=s.trades.slice().sort((a,b)=>(b.createdAt||b.id)-(a.createdAt||a.id)).slice(0,14);return`<div class="observer-shell">${topbar('QUAN SÁT VIÊN — Toàn cảnh')}<div class="split" style="margin-bottom:10px"><div><b>Thị trường ${s.round}/5 · ${PHASES[s.phase].name}</b><div class="muted">Chế độ chỉ xem: tiền, tài nguyên, dự án, giao dịch và tỉ giá.</div></div><div class="btn-row"><span class="badge">⏳ Vòng ${fmtTime(remainingTime(s))}</span><span class="badge">${Object.keys(s.players).length} người</span></div></div><div class="observer-grid"><div class="stack observer-wide"><div class="card observer-card"><div class="title">Doanh nghiệp & tài sản</div><div class="observer-player-grid">${Object.entries(s.players).map(([n,p])=>{const br=branchSummary(p);return`<div class="observer-player"><div class="split"><b>${esc(n)}</b><span class="tiny muted">${p.company}</span></div><div class="observer-money">${p.money}M</div><div class="inventory-chips">${RESOURCE_KEYS.filter(k=>(p.res[k]||0)>0).map(k=>`<span class="inventory-chip">${RES[k].icon}${p.res[k]}</span>`).join('')}</div>${Object.keys(br).length?`<div class="tiny" style="margin-top:5px">🏪 ${Object.entries(br).map(([k,v])=>`${RES[k].icon}×${v}`).join(' ')}</div>`:''}</div>`}).join('')}</div></div><div class="card observer-card"><div class="title">Dự án hiện tại</div><div class="observer-projects">${projects(s).map(p=>`<div class="observer-project"><div class="split"><b>${p.id}</b><span class="badge">${p.reward}M</span></div><b>${p.name}</b><div style="margin-top:4px">${needListHtml(p.need)}</div><div class="muted tiny" style="margin-top:4px">${Object.entries(s.players).filter(([,pl])=>pl.target===p.id).map(([n])=>n).join(' · ')||'Chưa có người chọn'}</div></div>`).join('')}</div></div></div><div class="stack">${observerRateCard(s)}${s.branchMarket?.enabled?`<div class="card observer-card branch-market-card"><div class="title">🏪 Thị trường chi nhánh</div><div class="branch-price ${s.branchMarket.price<=0?'sold-out':''}">${s.branchMarket.price<=0?'HẾT HÀNG':s.branchMarket.price+'M'}</div><div class="tiny muted">${s.branchMarket.frozen?'❄️ Đang đóng băng bán':'Đang mở'} · giá / chi nhánh · +10M mỗi 5 phút realtime đang chạy khi >0</div></div>`:''}${observerBranchesCard(s)}<div class="card observer-card"><div class="title">Kết quả vòng</div>${resultsCard(s).replace('class="card"','')}</div></div><div class="stack"><div class="card observer-card"><div class="title">Giao dịch gần đây</div><div class="observer-scroll">${recent.length?recent.map(t=>`<div class="trade-rule"><b>#${t.id}</b> ${t.originType==='sell'?'BÁN':'MUA'} · ${RES[t.res]?.icon||''}${RES[t.res]?.label||''} ×${t.qty} · <b>${t.price}M</b><br>${esc(t.proposer||t.initiator)} → ${esc(t.recipient||t.target||'ALL')} · ${t.status}</div>`).join(''):'<div class="muted">Chưa có giao dịch.</div>'}</div></div><div class="card observer-card"><div class="title">Nhật ký</div><div class="observer-scroll">${s.log.slice().reverse().slice(0,18).map(x=>`<div class="tiny">• ${esc(x)}</div>`).join('')}</div></div></div></div></div>`}
function hostView(){const s=load();if(s.gameOver)return finalView(s,'host');return`<div class="app">${topbar('HOST / Điều phối')}<div class="host-dashboard"><div class="stack">${timerCard(s,true)}<div class="card"><div class="split"><div class="title">Điều khiển ván</div><span class="badge">${Object.keys(s.players).length} người · Vòng ${s.round}/5</span></div>${roundTabs(s,true)}<div class="phase" style="margin-top:10px">${PHASES[s.phase].name}<small>${PHASES[s.phase].desc}</small></div><div style="margin-top:10px">${phaseButtons(s)}</div>${hostPrimaryAction(s)}<div class="rewind" style="margin-top:10px;padding:12px;border-radius:12px"><b>↩ Quay lại / Reset</b><div class="muted" style="margin:4px 0 8px">Các nút dưới đây thao tác trực tiếp.</div><div class="action-grid"><button class="action-tile" id="resetCurrentMarket">↩ RESET THỊ TRƯỜNG ${s.round}<span class="action-caption">Quay lại đúng đầu thị trường hiện tại</span></button>${s.round>1?`<button class="action-tile secondary" id="restorePrevRound">← THỊ TRƯỜNG ${s.round-1}<span class="action-caption">Hoàn tác về đầu thị trường trước</span></button>`:''}<button class="action-tile danger" id="resetWholeGame">⟲ RESET TOÀN BỘ GAME<span class="action-caption">Đưa tất cả về Thị trường 1 · P1</span></button></div></div></div>${branchMarketHostCard(s)}${hostMarketMeter(s)}<div class="card"><div class="split"><div class="title">Dự án — Thị trường ${s.round}</div><span class="badge">HOST CÓ THỂ CHỈNH</span></div><div class="muted tiny" style="margin-bottom:9px">Bố cục tự co giãn theo độ rộng/zoom. Mỗi thành phần nằm trên một hàng riêng để không vỡ khối.</div><div class="host-project-grid">${projects(s).map(p=>hostProjectEditor(p,s)).join('')}</div></div></div><div class="stack"><div class="card"><div class="title">Trạng thái người chơi</div><div style="overflow:auto"><table><thead><tr><th>Người</th><th>Doanh nghiệp</th><th>Mục tiêu</th><th>Quyết định</th><th>Đấu thầu</th></tr></thead><tbody>${Object.entries(s.players).map(([n,p])=>`<tr><td><b>${esc(n)}</b></td><td>${p.company}</td><td>${p.target||'—'}</td><td>${p.locked?'✅ Đã chốt':p.declinedProject?'❌ Từ chối':'—'}</td><td>${p.bid===null?'—':'Đã gửi'}</td></tr>`).join('')}</tbody></table></div></div>${hostSecretsCard(s)}${resultsCard(s)}<div class="card"><div class="title">Nhật ký</div><div class="stack">${s.log.slice().reverse().slice(0,16).map(x=>`<div class="tiny">• ${esc(x)}</div>`).join('')}</div></div></div></div></div>`}
function hostPrimaryAction(s){if(s.phase==='P4')return`<div class="notice" style="margin-top:10px">Mỗi người phải quyết định <b>CHỐT DỰ ÁN</b> (chỉ khi đủ tài nguyên) hoặc <b>TỪ CHỐI DỰ ÁN</b>. Khi mọi người đã quyết định, chuyển P5.</div>`;if(s.phase==='P5')return`<button class="btn warn big" id="resolveBtn" style="margin-top:10px">KIỂM TRA & GIẢI QUYẾT DỰ ÁN</button>`;if(s.phase==='P6')return`<button class="btn good big" id="settleBtn" style="margin-top:10px">THỰC HIỆN THANH TOÁN</button>`;if(s.phase==='P7'){if(s.round>=5)return`<div class="market-decision"><b>Đã hoàn thành Thị trường 5/5.</b><div class="muted">Đây là số thị trường tối đa. Host tiến hành tổng kết.</div><button class="btn good big" id="finishGameBtn" style="margin-top:10px">🏆 TỔNG KẾT & VINH DANH</button></div>`;return`<div class="market-decision"><b>Host quyết định sau Thị trường ${s.round}</b><div class="muted" style="margin-top:4px">Bạn có thể dừng ván ngay tại đây để tổng kết, hoặc mở Thị trường ${s.round+1}. Tối đa 5 thị trường.</div><div class="market-decision-grid"><button class="btn good big" id="nextRoundBtn">▶ CHƠI THỊ TRƯỜNG ${s.round+1}</button><button class="btn finish big" id="finishGameBtn">🏆 DỪNG & TỔNG KẾT</button></div></div>`}return''}
function resultsCard(s){const rs=s.results.filter(r=>r.round===s.round);return`<div class="card"><div class="title">Kết quả vòng ${s.round}</div>${rs.length?rs.map(r=>`<div class="${r.winner?'success':'danger'}" style="margin-bottom:7px"><b>${r.projectId}</b> — ${r.winner?`🏆 ${r.winner}, giá thầu ${r.bid||0}M`:'Không có người đủ điều kiện'}</div>`).join(''):'<div class="muted">Chưa xử lý kết quả.</div>'}</div>`}
function playerView(name){const s=load(),p=s.players[name];if(s.gameOver)return finalView(s,name);return`<div class="app">${topbar(`${name} — ${p.company}`)}<div class="grid grid-2"><div class="stack">${timerCard(s,false)}<div class="card"><div class="split"><div><div class="muted">Tài sản riêng</div><div class="money">${p.money}M</div></div><span class="badge">🔒 Chỉ bạn thấy</span></div><div class="resources">${visibleInventoryKeys(s,p).map(k=>`<div class="res"><span>${RES[k].icon} ${RES[k].label}</span><b>${p.res[k]||0}</b></div>`).join('')}</div></div>${branchPurchaseCard(name,s)}<div class="card"><div class="split"><div class="title">Trạng thái</div><span class="badge">Vòng ${s.round}/5</span></div>${roundTabs(s)}<div class="phase" style="margin-top:10px">${PHASES[s.phase].name}<small>${PHASES[s.phase].desc}</small></div>${phaseAction(name,s)}</div>${s.phase==='P3'?tradeComposer(name,s):''}${s.phase==='P5'?bidCard(name,s):''}</div><div class="stack"><div class="card"><div class="split"><div class="title">Dự án công khai</div>${['P2','P3'].includes(s.phase)&&!p.locked?'<span class="tap-badge">CÓ THỂ BẤM</span>':''}</div><div class="grid">${projects(s).map(pr=>projectCard(pr,s,{name,clickable:['P2','P3'].includes(s.phase)&&!p.locked})).join('')}</div></div><div class="card"><div class="title">Doanh nghiệp khác</div><table><thead><tr><th>Người</th><th>Doanh nghiệp</th><th>Mục tiêu</th><th>Tồn kho</th></tr></thead><tbody>${Object.entries(s.players).filter(([n])=>n!==name).map(([n,op])=>`<tr><td><b>${n}</b></td><td>${op.company}</td><td>${op.target||'—'}${op.locked?' 🔒':''}</td><td>🔒 Bí mật</td></tr>`).join('')}</tbody></table></div>${tradeInbox(name,s)}${privateResult(name,s)}</div></div></div>`}
function phaseAction(name,s){
  const p=s.players[name];
  if(s.phase==='P1')return`<div class="notice" style="margin-top:10px">Xem 3 dự án. Tính mình có gì, thiếu gì và cần tìm ai. <b>Chưa giao dịch.</b></div>`;
  if(['P2','P3'].includes(s.phase))return`<div class="notice" style="margin-top:10px">${p.target?`Bạn đang chọn <b>${p.target}</b>. Khối dự án đã đổi màu.`:'Hãy bấm trực tiếp vào một khối dự án.'}</div>`;
  if(s.phase==='P4'){
    if(p.locked)return`<div class="success" style="margin-top:10px"><b>ĐÃ CHỐT ${p.target}</b>. Bạn đã đủ tài nguyên tại thời điểm chốt và không thể đổi dự án nữa.</div>`;
    if(p.declinedProject)return`<div class="danger" style="margin-top:10px"><b>ĐÃ TỪ CHỐI DỰ ÁN VÒNG NÀY.</b><br>Bạn sẽ không được xét dự án ở P5. Nếu cần thay đổi quyết định, hãy xin Host quay lại P3/P4 hoặc reset thị trường.</div>`;
    if(!p.target)return`<div class="project-audit missing"><b>Bạn chưa chọn dự án.</b><div class="muted" style="margin-top:4px">Không thể chốt. Bạn có thể từ chối tham gia dự án vòng này.</div><button class="btn bad big" id="declineProject" style="margin-top:9px">❌ TỪ CHỐI DỰ ÁN VÒNG NÀY</button></div>`;
    const pr=projectById(s,p.target),miss=shortageList(p,pr.need);
    if(miss.length)return`<div class="project-audit missing"><b>⚠️ CHƯA THỂ CHỐT ${p.target}</b><div style="margin-top:5px">Bạn còn thiếu tài nguyên:</div><div class="missing-list">${shortageHtml(p,pr.need)}</div><div class="muted" style="margin-top:8px">Bạn có thể xin Host gia hạn/quay lại P3 để tiếp tục giao dịch, hoặc từ chối dự án vòng này.</div><div class="decision-grid"><button class="btn good big" id="lockProject" disabled>🔒 CHƯA ĐỦ TÀI NGUYÊN</button><button class="btn bad big" id="declineProject">❌ TỪ CHỐI DỰ ÁN</button></div></div>`;
    return`<div class="project-audit ok"><b>✅ ĐỦ TÀI NGUYÊN CHO ${p.target}</b><div class="muted" style="margin-top:5px">Yêu cầu: ${needText(pr.need)}. Bạn có thể chốt hoặc chủ động từ chối dự án.</div><div class="decision-grid"><button class="btn good big" id="lockProject">🔒 CHỐT DỰ ÁN ${p.target}</button><button class="btn bad big" id="declineProject">❌ TỪ CHỐI DỰ ÁN</button></div></div>`
  }
  if(s.phase==='P5'){
    if(p.declinedProject)return`<div class="danger" style="margin-top:10px">Bạn đã từ chối dự án vòng này nên không tham gia xét/đấu thầu.</div>`;
    return`<div class="notice" style="margin-top:10px">Hệ thống kiểm tra người đã chốt. Nếu có đối thủ cùng dự án và cùng đủ điều kiện, các bên đấu thầu kín.</div>`
  }
  if(s.phase==='P6')return`<div class="notice" style="margin-top:10px">Đang chờ Host thực hiện thanh toán. Người thắng sẽ bị trừ tài nguyên yêu cầu + giá thầu, sau đó nhận tiền thưởng.</div>`;
  if(s.phase==='P7')return`<div class="success" style="margin-top:10px">Vòng ${s.round} đã hoàn tất. Tài nguyên chưa dùng và tiền còn lại được giữ sang vòng sau.</div>`;
  return''
}

  const others=Object.keys(s.players).filter(n=>n!==name);
  return`<div class="card">
    <div class="split"><div class="title">🤝 Gửi đề nghị giao dịch</div><div><span class="tap-badge">CÓ THỂ BẤM</span> <span class="offer-count">KHÔNG GIỚI HẠN LẦN GỬI</span></div></div>
    <div class="trade-kind-grid">
      <button class="trade-kind-btn selected tradeKindBtn" data-kind="buy">🛒 TÔI MUỐN MUA</button>
      <button class="trade-kind-btn tradeKindBtn" data-kind="sell">🏷️ TÔI MUỐN BÁN</button>

    <div class="field"><label id="tradeTargetLabel">Gửi đề nghị mua đến</label>
      <select id="tradeTo">

      <div class="field"><label>Số lượng</label><input id="tradeQty" type="number" min="1" value="1"></div>
    </div>

    <button class="btn big" id="sendTrade" style="margin-top:10px">GỬI ĐỀ NGHỊ MUA</button>
    <div class="trade-rule"><b>Có thể gửi nhiều đề nghị liên tiếp.</b> Mỗi lần bấm GỬI tạo một đề nghị độc lập mới. <b>Không giữ chỗ tài sản.</b> Khi chấp nhận, hệ thống kiểm tra lại tiền và tài nguyên; đề nghị có thể hết hiệu lực nếu tài sản đã dùng cho giao dịch khác.</div>
  </div>`
}
function tradeParties(t,actor=null){
  let buyer=t.buyer||null,seller=t.seller||null;
  if((!buyer||!seller)&&actor){
    if(t.originType==='sell'){seller=t.initiator;buyer=actor}
    else{buyer=t.initiator;seller=actor}
  }
  return{buyer,seller}
}
function rootTrade(s,t){return s.trades.find(x=>x.id===t.rootId)||t}
function negotiationOther(name,t){
  if(!t)return null;if(t.mode==='all'&&t.stage==='root')return t.initiator===name?null:t.initiator;
  const p=tradeParties(t,name);if(p.buyer===name)return p.seller;if(p.seller===name)return p.buyer;
  if(t.proposer===name)return t.recipient||null;if(t.recipient===name)return t.proposer||null;return null;
}
function negotiationHistoryBox(name,t,archive=false){const other=negotiationOther(name,t);if(!other)return'';return`<div class="${archive?'':'neg-chat'}"><div class="${archive?'':'neg-chat-head'}">${archive?'':`<b>💬 Lịch sử thương lượng với ${esc(other)}</b><span class="tiny muted">#${t.rootId}</span>`}</div><div class="negotiation-history" data-neg-root="${t.rootId}" data-neg-other="${esc(other)}"><span class="muted tiny">Chưa có tin nhắn.</span></div></div>`}
function negotiationArchive(name,s){
  const seen=new Set(),rows=[];for(const t of s.trades.slice().reverse()){if(!tradeRelevant(name,t))continue;const other=negotiationOther(name,t);if(!other)continue;const key=t.rootId+'|'+other;if(seen.has(key))continue;seen.add(key);rows.push({t,other});if(rows.length>=6)break}
  if(!rows.length)return'';return`<div class="footer-note"><b>💬 Lịch sử thương lượng</b>${rows.map(({t,other})=>`<details class="neg-archive"><summary>#${t.rootId} · với ${esc(other)} · ${statusVi(rootTrade(s,t).status)}</summary>${negotiationHistoryBox(name,t,true)}</details>`).join('')}</div>`
}
function negotiationRpcAuth(name){return{p_member_token:accessIsAdmin()?null:currentMemberToken(),p_admin_token:accessIsAdmin()?ADMIN_TOKEN:null,p_admin_player_name:accessIsAdmin()?name:null}}
function renderNegotiationMessages(el,rows,name){
  if(!rows?.length){el.innerHTML='<span class="muted tiny">Chưa có tin nhắn.</span>';return}
  el.innerHTML=rows.map(m=>`<div class="neg-msg ${m.sender_name===name?'mine':''}"><span class="who">${esc(m.sender_name)}</span><span>${esc(m.body)}</span><span class="when">${new Date(m.created_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('');el.scrollTop=el.scrollHeight;
}
async function refreshNegotiationHistories(name){
  if(!ROOM?.id||!SB||!name)return;const els=[...document.querySelectorAll('.negotiation-history[data-neg-root][data-neg-other]')];if(!els.length)return;
  const groups=new Map();for(const el of els){const key=el.dataset.negRoot+'|'+el.dataset.negOther;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(el)}
  for(const [key,list] of groups){const [root,other]=key.split('|');try{const {data,error}=await SB.rpc('get_negotiation_messages',{p_room_id:ROOM.id,p_root_trade_id:Number(root),p_other_name:other,...negotiationRpcAuth(name)});if(error)throw error;for(const el of list)renderNegotiationMessages(el,data||[],name)}catch(e){for(const el of list)el.innerHTML='<span class="muted tiny">Không tải được lịch sử.</span>'}}
}
async function sendNegotiationMessage(name,t,message){
  const body=String(message||'').trim();if(!body)return;const other=negotiationOther(name,t);if(!other||!ROOM?.id)throw new Error('Không xác định được người nhận tin nhắn.');
  const {error}=await SB.rpc('send_negotiation_message',{p_room_id:ROOM.id,p_root_trade_id:Number(t.rootId),p_other_name:other,p_body:body,...negotiationRpcAuth(name)});if(error)throw error;await broadcastRoomSignal('negotiation_changed',{rootId:t.rootId});
}
async function closeNegotiationThread(name,t,decision){const other=negotiationOther(name,t);if(!other||!ROOM?.id)return;try{await SB.rpc('close_negotiation_thread',{p_room_id:ROOM.id,p_root_trade_id:Number(t.rootId),p_other_name:other,p_decision:decision,...negotiationRpcAuth(name)});await broadcastRoomSignal('negotiation_changed',{rootId:t.rootId})}catch(e){console.warn('close negotiation thread failed',e)}}
function tradeRelevant(name,t){
  if(t.initiator===name||t.proposer===name||t.recipient===name||t.buyer===name||t.seller===name)return true;
  return t.mode==='all'&&t.stage==='root'&&t.initiator!==name
}
function isIncomingTrade(name,t){
  if(t.status!=='pending')return false;
  if(t.mode==='all'&&t.stage==='root'){
    if(t.initiator===name)return false;
    const state=(t.responses||{})[name];
    return state!=='declined'&&state!=='negotiating'&&state!=='closed';
  }
  return t.recipient===name
}
function acceptLabel(name,t){
  const parties=tradeParties(t,name);
  if(parties.buyer===name)return'ĐỒNG Ý MUA';
  if(parties.seller===name)return'ĐỒNG Ý BÁN';
  return'CHẤP NHẬN'
}
function tradeTypeBadge(t){
  const proposerRole=t.proposer===t.buyer?'buy':t.proposer===t.seller?'sell':t.originType;
  return`<span class="trade-type-badge ${proposerRole==='buy'?'trade-type-buy':'trade-type-sell'}">${proposerRole==='buy'?'ĐỀ NGHỊ MUA':'ĐỀ NGHỊ BÁN'}</span>`
}
function tradeSummary(t,viewer){
  if(t.mode==='all'&&t.stage==='root'){
    if(t.originType==='sell')return`<b>${t.initiator}</b> chào bán ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} cho <b>TẤT CẢ</b> với tổng giá <b>${t.price}M</b>.`;
    return`<b>${t.initiator}</b> muốn mua ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} từ <b>TẤT CẢ</b> với tổng giá <b>${t.price}M</b>.`
  }
  const p=tradeParties(t,viewer);
  if(t.proposer===p.buyer)return`<b>${t.proposer}</b> đề nghị mua ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} từ <b>${p.seller}</b> với tổng giá <b>${t.price}M</b>.`;
  return`<b>${t.proposer}</b> đề nghị bán ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} cho <b>${p.buyer}</b> với tổng giá <b>${t.price}M</b>.`
}

    <div class="split"><div>${tradeTypeBadge(t)} ${broadcast?'<span class="trade-status">📣 ALL</span>':''}</div><span class="trade-status">#${t.id}</span></div>

function tradeInbox(name,s){
  const inc=s.trades.filter(t=>t.round===s.round&&isIncomingTrade(name,t));
  const recent=s.trades.filter(t=>tradeRelevant(name,t)).slice().reverse().slice(0,10);
  return`<div class="card">
    <div class="split"><div class="title">Đề nghị giao dịch</div>${inc.length?`<span class="tap-badge">${inc.length} CẦN PHẢN HỒI</span>`:''}</div>
    <div class="stack">${inc.length?inc.map(t=>incomingTradeCard(name,t)).join(''):'<div class="muted">Không có đề nghị chờ xử lý.</div>'}</div>
    ${recent.length?`<div class="footer-note"><b>Lịch sử gần đây</b><br>${recent.map(t=>`#${t.id} ${tradeHistoryText(t,name)} — <b>${statusVi(t.status)}</b>`).join('<br>')}</div>`:''}
    ${negotiationArchive(name,s)}
  </div>`
}
function tradeHistoryText(t,name){
  if(t.mode==='all'&&t.stage==='root')return`${t.initiator} ${t.originType==='sell'?'bán':'mua'} ALL ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} · ${t.price}M`;
  const p=tradeParties(t,name);
  return`${p.buyer||'?'} mua từ ${p.seller||'?'} ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} · ${t.price}M`
}
function bidCard(name,s){const p=s.players[name];if(p.declinedProject)return`<div class="card"><div class="danger">Bạn đã từ chối dự án vòng này.</div></div>`;if(!p.locked||!p.target)return`<div class="card"><div class="danger">Bạn chưa chốt dự án.</div></div>`;const pr=projectById(s,p.target),eligible=enough(p,pr.need),same=Object.entries(s.players).filter(([n,op])=>op.locked&&op.target===p.target&&enough(op,pr.need));if(!eligible)return`<div class="card"><div class="danger"><b>Không đủ tài nguyên cho ${p.target}.</b><br>Cần ${needText(pr.need)}. Dự án của bạn sẽ không được xét.</div></div>`;if(same.length<=1)return`<div class="card"><div class="success"><b>Bạn đủ điều kiện.</b> Hiện không có đối thủ đủ điều kiện cùng dự án. Không cần đấu thầu.</div></div>`;return`<div class="card"><div class="title">⚔️ Đấu thầu kín — ${p.target}</div><div class="notice">Có ${same.length} người đủ điều kiện cùng tranh dự án. Nhập số tiền bạn sẵn sàng trả thêm cho Ngân hàng. Giá này là bí mật.</div>${p.bid===null?`<div class="field"><label>Giá thầu (M)</label><input id="bidAmount" type="number" min="0" max="${p.money}" value="0"></div><button class="btn warn big" id="submitBid">GỬI GIÁ THẦU KÍN</button>`:`<div class="success" style="margin-top:8px">✅ Đã gửi giá thầu. Chờ Host giải quyết.</div>`}</div>`}
function privateResult(name,s){const rs=s.results.filter(r=>r.round===s.round&&(r.winner===name||s.players[name].target===r.projectId));if(!rs.length)return'';return`<div class="card"><div class="title">Kết quả của bạn</div>${rs.map(r=>r.winner===name?`<div class="success">🏆 Bạn thắng <b>${r.projectId}</b>. Giá thầu ${r.bid||0}M.</div>`:`<div class="danger">Bạn không thắng <b>${r.projectId}</b>.</div>`).join('')}</div>`}

function statusVi(x){
  return x==='pending'?'đang chờ':
    x==='accepted'?'hoàn tất':
    x==='declined'?'đã từ chối':
    x==='superseded'?'đã được thương lượng lại':
    x==='closed'?'đã đóng':
    x==='expired'?'hết hạn':'đã đóng'
}
function ranking(s){const rows=Object.entries(s.players).map(([name,p])=>{const resCount=Object.values(p.res).reduce((a,b)=>a+b,0),resValue=resCount*LIQUIDATION_VALUE,projectRevenue=p.wins.reduce((a,w)=>a+w.reward,0),auctionCost=p.wins.reduce((a,w)=>a+(w.bid||0),0),tradeCount=s.trades.filter(t=>t.status==='accepted'&&(t.buyer===name||t.seller===name||t.from===name||t.to===name)).length;return{name,cash:p.money,resCount,resValue,total:p.money+resValue,wins:p.wins.length,projectRevenue,auctionCost,tradeCount,company:p.company}}).sort((a,b)=>b.total-a.total||b.cash-a.cash||b.wins-a.wins||a.name.localeCompare(b.name));let prevTotal=null,prevRank=0;rows.forEach((r,i)=>{if(i===0||r.total!==prevTotal)prevRank=i+1;r.rank=prevRank;prevTotal=r.total});return rows}
function medalForRank(rank){return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'◆'}

etWholeGame">⟲ CHƠI VÁN MỚI<span class="action-caption">Giữ danh sách người chơi hiện tại và reset về Thị trường 1</span></button></div>`:''}</div></div>`}

function applyTimerPreset(sec){
  const s=load();pauseGameClock(s);
  s.timer={duration:sec,remaining:sec,endAt:null,running:false,expired:false,autoPassed:{}};
  logPush(s,`Host đặt đồng hồ ${fmtTime(sec)} cho Vòng ${s.round}. Realtime tạm dừng.`);
  save(s);render()
}
function parseManualTimer(raw){
  raw=String(raw??'').trim();
  if(!raw)return 0;
  if(raw.includes(':')){
    const parts=raw.split(':');
    const min=Math.max(0,parseInt(parts[0]||'0',10)||0);
    const sec=Math.max(0,parseInt(parts[1]||'0',10)||0);
    return min*60+sec
  }
  const min=Math.max(0,parseInt(raw,10)||0);
  return min*60
}
function applyManualTimer(){
  const el=document.getElementById('manualTimerInput');
  const sec=parseManualTimer(el?el.value:'');
  const s=load();pauseGameClock(s);
  s.timer={duration:sec,remaining:sec,endAt:null,running:false,expired:sec===0,autoPassed:{}};
  logPush(s,`Host nhập thời gian thủ công ${fmtTime(sec)} cho Vòng ${s.round}. Realtime tạm dừng.`);
  save(s);render()
}
function setTimerZero(){
  const s=load();pauseGameClock(s);
  s.timer={duration:0,remaining:0,endAt:null,running:false,expired:true,autoPassed:{P7:true}};
  logPush(s,`Host đặt đồng hồ về 00:00 (không tự chuyển pha). Realtime tạm dừng.`);
  save(s);render()
}
function toggleTimer(){
  const s=load(),rem=remainingTime(s);
  if(s.timer.running){
    pauseGameClock(s);s.timer.remaining=rem;s.timer.running=false;s.timer.endAt=null;
    logPush(s,`Host dừng đồng hồ tại ${fmtTime(rem)}. Realtime tạm dừng.`)
  }else{
    if(rem<=0){if((s.timer.duration||0)<=0){save(s);render();return}s.timer.remaining=s.timer.duration}
    s.timer.endAt=Date.now()+s.timer.remaining*1000;s.timer.running=true;s.timer.expired=false;resumeGameClock(s);
    logPush(s,`Host bắt đầu đồng hồ Vòng ${s.round}. Realtime tiếp tục chạy.`)
  }
  save(s);render()
}
function extendTimer(sec){
  const s=load();
  if(s.timer.running)s.timer.endAt+=sec*1000;else s.timer.remaining=remainingTime(s)+sec;
  if((s.timer.duration||0)===0)s.timer.duration=s.timer.remaining;s.timer.expired=false;
  const rem=remainingTime(s),th=AUTO_PHASE_THRESHOLDS[s.phase];if(th!==undefined&&rem>th){s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed[s.phase]=false}
  logPush(s,`Host gia hạn +${sec}s.`);save(s);render()
}
function expireOpenTrades(s,round){
  for(const t of s.trades)if(t.round===round&&t.status==='pending')t.status='expired'
}
function expireTimerNow(){
  const s=load();pauseGameClock(s);
  s.timer.running=false;s.timer.remaining=0;s.timer.endAt=null;s.timer.expired=true;
  if(['P1','P2','P3'].includes(s.phase))s.phase='P4';
  logPush(s,`Hết giờ Vòng ${s.round}; thị trường đóng. Realtime tạm dừng.`);
  expireOpenTrades(s,s.round);save(s);render()
}
function restoreRound(target){
  const s=load();
  target=Number(target);
  if(!Number.isInteger(target)||target<1||target>5){return}
  const snap=s.snapshots[String(target)];
  if(!snap){
    logPush(s,`Không thể quay lại Thị trường ${target}: chưa có mốc lưu.`);
    save(s);render();return;
  }
  s.round=target;
  s.phase='P1';
  s.players=deep(snap.players);
  s.trades=deep(snap.trades);
  s.results=deep(snap.results);
  s.settledRound=snap.settledRound;
  s.seq=snap.seq;
  if(snap.branchMarket)s.branchMarket=deep(snap.branchMarket);
  s.gameOver=false;
  s.endedAtRound=null;
  s.gameEndedAt=null;
  pauseGameClock(s);
  s.timer=defaultTimer();
  for(const k of Object.keys(s.snapshots)) if(+k>target) delete s.snapshots[k];
  logPush(s,`↩ Đã khôi phục về ĐẦU THỊ TRƯỜNG ${target}.`);
  save(s);
  render();
}

function bindBranchUI(name){
  const resSel=document.getElementById('branchRes');
  const qtyEl=document.getElementById('branchQty');
  const buyBtn=document.getElementById('buyBranch');
  const hint=document.getElementById('branchBuyHint');

  // Không có khối mua chi nhánh (cơ chế tắt, hết hàng hoặc đang P4–P7) thì thoát an toàn.
  if(!resSel&&!qtyEl&&!buyBtn)return;

  function refreshHint(adjustQty=false){
    const s=load(),p=s.players[name];
    if(!p||!s.branchMarket?.enabled)return;
    const res=resSel?.value;
    if(!res||!RES[res])return;
    const own=res===p.businessId;
    if(qtyEl){
      qtyEl.min=own?'1':'3';
      qtyEl.step=own?'1':'3';
      let q=Math.max(1,Math.floor(Number(qtyEl.value)||1));
      if(!own&&adjustQty&&q%3!==0)q=Math.max(3,Math.ceil(q/3)*3);
      if(own&&adjustQty&&q<1)q=1;
      if(adjustQty)qtyEl.value=String(q);
    }
    const q=Math.max(1,Math.floor(Number(qtyEl?.value)||1));
    const valid=own||q%3===0;
    const total=(Number(s.branchMarket.price)||0)*q;
    if(hint)hint.innerHTML=own
      ?`Giá hiện tại: <b>${s.branchMarket.price}M/chi nhánh</b>. Đây là chi nhánh <b>đúng thế mạnh</b>: mua từng chiếc · ${q} chi nhánh = <b>${total}M</b> · tạo +${q} ${RES[res].icon}/phút.`
      :`Giá hiện tại: <b>${s.branchMarket.price}M/chi nhánh</b>. Đây là chi nhánh <b>ngoài thế mạnh</b>: bắt buộc mua số lượng chia hết cho 3. ${valid?`${q} chi nhánh = <b>${total}M</b> · tạo +${Math.floor(q/3)*2} ${RES[res].icon}/3 phút.`:`Số lượng <b>${q}</b> chưa hợp lệ.`}`;
  }

  if(resSel)resSel.onchange=()=>refreshHint(true);
  if(qtyEl){
    qtyEl.oninput=()=>refreshHint(false);
    qtyEl.onblur=()=>refreshHint(true);
  }
  if(buyBtn)buyBtn.onclick=()=>{
    const s=load(),p=s.players[name];
    if(!p||!s.branchMarket?.enabled)return;
    if(s.branchMarket.frozen){alert('Host đang đóng băng bán chi nhánh.');return}
    if(!['P1','P2','P3'].includes(s.phase)){alert('Chỉ được mua chi nhánh trong P1–P3.');return}
    const price=Math.max(0,Number(s.branchMarket.price)||0);
    if(price<=0){alert('Thị trường chi nhánh đang hết hàng.');return}
    const res=resSel?.value;
    let qty=Math.floor(Number(qtyEl?.value)||0);
    if(!res||!RES[res]){alert('Hãy chọn loại chi nhánh.');return}
    if(!Number.isInteger(qty)||qty<=0){alert('Số lượng chi nhánh phải là số nguyên dương.');return}
    const own=res===p.businessId;
    if(!own&&qty%3!==0){alert('Chi nhánh ngoài thế mạnh phải mua theo cụm 3: 3, 6, 9...');return}
    const cost=price*qty;
    if(p.money<cost){alert(`Bạn cần ${cost}M nhưng hiện chỉ có ${p.money}M.`);return}
    p.money-=cost;
    if(!Array.isArray(p.branches))p.branches=[];for(const b of p.branches){if(!Number.isFinite(Number(b.boughtAtActiveMs)))b.boughtAtActiveMs=activeElapsedMsNow(s);}
    p.branches.push({res,count:qty,boughtAt:Date.now(),boughtAtActiveMs:activeElapsedMsNow(s),cyclesCredited:0,unitPrice:price,cost});
    logPush(s,`🏪 ${name} mua ${qty} chi nhánh ${RES[res].label} với ${cost}M${own?' (đúng thế mạnh)':' (ngoài thế mạnh)'}.`);
    save(s);render();
  };
  refreshHint(true);
}

    else hint.innerHTML='👤 <b>Gửi riêng:</b> hai bên có thể chấp nhận, từ chối hoặc thương lượng giá qua lại nhiều lần.';

function sendTradeOffer(name){
  const s=load();
  if(s.phase!=='P3')return;
  const kind=document.getElementById('tradeKind')?.value||'buy';
  const target=document.getElementById('tradeTo')?.value||'ALL';
  const res=document.getElementById('tradeRes')?.value;
  const qty=Math.max(1,Number(document.getElementById('tradeQty')?.value)||1);
  const price=Math.max(0,Number(document.getElementById('tradeMoney')?.value)||0);
  const actor=s.players[name];
  if(kind==='buy'&&actor.money<price){alert('Bạn không đủ tiền cho đề nghị mua này.');return}
  if(kind==='sell'&&(actor.res[res]||0)<qty){alert('Bạn không có đủ tài nguyên để gửi đề nghị bán này.');return}
  const id=s.seq++;
  const all=target==='ALL';
  const trade={
    schema:2,id,rootId:id,round:s.round,mode:all?'all':'direct',originType:kind,
    initiator:name,target:all?'ALL':target,res,qty,price,proposer:name,
    recipient:all?null:target,buyer:kind==='buy'?name:(all?null:target),
    seller:kind==='sell'?name:(all?null:target),stage:'root',status:'pending',
    responses:{},branchWith:all?null:target,createdAt:Date.now()
  };
  s.trades.push(trade);
  const sentThisRound=s.trades.filter(x=>x.round===s.round&&x.initiator===name&&x.stage==='root').length;
  logPush(s,`${name} gửi đề nghị #${id} ${kind==='buy'?'MUA':'BÁN'} ${all?'cho ALL':`cho ${target}`} (lần ${sentThisRound} trong vòng).`);
  save(s);render()
}
function canRespondToTrade(name,t){
  if(!t||t.status!=='pending')return false;
  if(t.mode==='all'&&t.stage==='root'){
    if(t.initiator===name)return false;
    const state=(t.responses||{})[name];
    return state!=='declined'&&state!=='negotiating'&&state!=='closed'
  }
  return t.recipient===name
}
function executeTrade(s,t,actor){
  const parties=tradeParties(t,actor);
  const buyer=parties.buyer,seller=parties.seller;
  if(!buyer||!seller||buyer===seller)return'Không xác định được hai bên giao dịch.';
  const bp=s.players[buyer],sp=s.players[seller];
  if(!bp||!sp)return'Người chơi không còn hợp lệ.';
  if(bp.money<t.price)return`${buyer} không còn đủ ${t.price}M.`;
  if((sp.res[t.res]||0)<t.qty)return`${seller} không còn đủ ${RES[t.res].label}×${t.qty}.`;
  bp.money-=t.price;sp.money+=t.price;sp.res[t.res]-=t.qty;bp.res[t.res]+=t.qty;
  t.buyer=buyer;t.seller=seller;t.status='accepted';t.acceptedAt=Date.now();
  for(const other of s.trades){
    if(other.rootId===t.rootId&&other.id!==t.id&&other.status==='pending')other.status='closed'
  }
  const root=rootTrade(s,t);
  if(root.id!==t.id&&root.status==='pending')root.status='closed';
  if(root.responses){
    for(const k of Object.keys(root.responses))root.responses[k]='closed'
  }
  logPush(s,`✅ Giao dịch #${t.id}: ${buyer} mua ${RES[t.res].icon} ${RES[t.res].label} ×${t.qty} từ ${seller} với ${t.price}M.`);
  return null
}
async function acceptTrade(name,id){
  const s=load(),t=s.trades.find(x=>x.id===id);if(s.phase!=='P3'){alert('Chỉ chấp nhận giao dịch trong P3.');return}if(!canRespondToTrade(name,t)){render();return}
  const err=executeTrade(s,t,name);if(err){alert(err);return}save(s);await closeNegotiationThread(name,t,'accepted');render()
}
async function declineTrade(name,id){
  const s=load(),t=s.trades.find(x=>x.id===id);
  if(!canRespondToTrade(name,t)){render();return}
  const root=rootTrade(s,t);
  if(t.mode==='all'&&t.stage==='root'){
    t.responses=t.responses||{};t.responses[name]='declined';
    logPush(s,`${name} từ chối đề nghị ALL #${t.id}.`)
  }else{
    t.status='declined';
    if(root.mode==='all'&&t.branchWith){
      root.responses=root.responses||{};root.responses[t.branchWith]='declined';
      for(const x of s.trades)if(x.rootId===t.rootId&&x.branchWith===t.branchWith&&x.id!==t.id&&x.status==='pending')x.status='closed'
    }else{
      for(const x of s.trades)if(x.rootId===t.rootId&&x.id!==t.id&&x.status==='pending')x.status='closed'
    }
    logPush(s,`${name} từ chối đề nghị #${t.id}.`)
  }
  save(s);await closeNegotiationThread(name,t,'declined');render()
}
async function sendCounterOffer(name,id,newPrice,message=''){
  const s=load(),t=s.trades.find(x=>x.id===id);
  newPrice=Number(newPrice);
  if(s.phase!=='P3'){alert('Chỉ thương lượng trong P3.');return}
  if(!Number.isFinite(newPrice)||newPrice<0){alert('Giá thương lượng không hợp lệ.');return}
  if(!canRespondToTrade(name,t)){render();return}
  const parties=tradeParties(t,name),buyer=parties.buyer,seller=parties.seller;
  if(!buyer||!seller)return;
  if(name===buyer&&s.players[name].money<newPrice){alert('Bạn không đủ tiền cho giá thương lượng này.');return}
  if(name===seller&&(s.players[name].res[t.res]||0)<t.qty){alert('Bạn không còn đủ tài nguyên cho đề nghị này.');return}
  const other=name===buyer?seller:buyer;
  if(String(message||'').trim()){try{await sendNegotiationMessage(name,t,message)}catch(e){alert('Không gửi được tin nhắn: '+(e.message||e));return}}
  const root=rootTrade(s,t);
  const branchWith=root.mode==='all'?(root.initiator===name?other:name):(t.branchWith||other);
  if(t.mode==='all'&&t.stage==='root'){
    t.responses=t.responses||{};t.responses[name]='negotiating'
  }else{
    t.status='superseded';
    if(root.mode==='all'){
      root.responses=root.responses||{};root.responses[branchWith]='negotiating'
    }
  }
  const nid=s.seq++;
  s.trades.push({
    schema:2,id:nid,rootId:t.rootId,round:s.round,mode:t.mode,originType:t.originType,
    initiator:root.initiator,target:root.target,res:t.res,qty:t.qty,price:newPrice,
    proposer:name,recipient:other,buyer,seller,stage:'counter',status:'pending',
    responses:{},branchWith,createdAt:Date.now(),parentId:t.id
  });
  logPush(s,`💬 ${name} thương lượng lại giao dịch #${t.rootId}: ${newPrice}M${String(message||'').trim()?' + tin nhắn':''}.`);
  save(s);render();setTimeout(()=>refreshNegotiationHistories(name),120)
}
function computeRoundResolution(s){const out=[];for(const pr of projects(s)){const contenders=Object.entries(s.players).filter(([,pl])=>pl.locked&&pl.target===pr.id&&enough(pl,pr.need));if(!contenders.length){out.push({round:s.round,projectId:pr.id,winner:null,bid:0});continue}let winner=null,bid=0;if(contenders.length===1){winner=contenders[0][0]}else{const missing=contenders.filter(([,pl])=>pl.bid===null);if(missing.length)return{ok:false,missing:missing.map(([n])=>n)};const top=Math.max(...contenders.map(([,pl])=>pl.bid||0)),tops=contenders.filter(([,pl])=>(pl.bid||0)===top);winner=tops[Math.floor(Math.random()*tops.length)][0];bid=top}out.push({round:s.round,projectId:pr.id,winner,bid})}return{ok:true,results:out}}
function resolveProjects(){const s=load();if(s.phase!=='P5')return;const calc=computeRoundResolution(s);if(!calc.ok){alert('Còn người đủ điều kiện chưa gửi giá thầu kín: '+calc.missing.join(', '));return}s.results=s.results.filter(r=>r.round!==s.round).concat(calc.results);logPush(s,`Đã giải quyết cạnh tranh Vòng ${s.round}.`);s.phase='P6';s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed.P5=true;save(s);render()}
function settleProjectsCore(s){if(s.settledRound===s.round)return false;for(const r of s.results.filter(x=>x.round===s.round&&x.winner)){const pr=projectById(s,r.projectId),pl=s.players[r.winner];if(!enough(pl,pr.need))continue;if(pl.money<(r.bid||0))continue;for(const[k,v]of Object.entries(pr.need))pl.res[k]-=v;pl.money-=r.bid||0;pl.money+=pr.reward;pl.wins.push({round:s.round,projectId:r.projectId,reward:pr.reward,bid:r.bid||0})}s.settledRound=s.round;s.phase='P7';logPush(s,`Đã thanh toán Vòng ${s.round}.`);return true}
function settleProjects(){const s=load();if(s.phase!=='P6'||s.settledRound===s.round)return;if(settleProjectsCore(s)){s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed.P6=true;save(s);render()}}

function finishGame(){const s=load();if(s.phase!=='P7')return;pauseGameClock(s);s.gameOver=true;s.endedAtRound=s.round;s.gameEndedAt=Date.now();s.timer.running=false;s.timer.remaining=0;s.timer.endAt=null;logPush(s,`Host kết thúc ván sau Thị trường ${s.round}. Công khai tài sản và bảng xếp hạng.`);save(s);render()}
function nextRound(){
  const s=load();
  if(s.phase!=='P7')return;
  if(s.round>=5){finishGame();return}
  const prev=s.round;
  s.round++;s.phase='P1';
  for(const[n,p]of Object.entries(s.players)){
    p.target=null;p.locked=false;p.declinedProject=false;p.bid=null;
    const refill=p.refill||{};
    for(const[k,v]of Object.entries(refill))p.res[k]=(p.res[k]||0)+v
  }
  expireOpenTrades(s,prev);
  pauseGameClock(s);
  s.markets[s.round]=buildCurrentRoundProjects(s.players,s.round);
  s.timer=defaultTimer();
  s.snapshots[String(s.round)]=makeRoundSnapshot(s);
  logPush(s,`Mở Thị trường ${s.round}. Đã +3 tài nguyên chuyên môn và tái cân dự án theo tổng tồn kho thật.`);
  save(s);render()
}

function autoAdvanceByCountdown(s,rem){if(!s.timer?.running)return false;s.timer.autoPassed=s.timer.autoPassed||{};const phase=s.phase,threshold=AUTO_PHASE_THRESHOLDS[phase];if(threshold===undefined||s.timer.autoPassed[phase]||rem>threshold)return false;
  if(phase==='P1'){s.timer.autoPassed.P1=true;s.phase='P2';logPush(s,'⏱ Mốc 10:00: tự chuyển P1 → P2.');return true}
  if(phase==='P2'){s.timer.autoPassed.P2=true;s.phase='P3';logPush(s,'⏱ Mốc 08:30: tự chuyển P2 → P3.');return true}
  if(phase==='P3'){s.timer.autoPassed.P3=true;s.phase='P4';expireOpenTrades(s,s.round);logPush(s,'⏱ Mốc 03:00: tự chuyển P3 → P4 và đóng giao dịch đang chờ.');return true}
  if(phase==='P4'){s.timer.autoPassed.P4=true;s.phase='P5';logPush(s,'⏱ Mốc 02:30: tự chuyển P4 → P5.');return true}
  if(phase==='P5'){const calc=computeRoundResolution(s);if(!calc.ok){if(!s.timer.autoBlockedP5){s.timer.autoBlockedP5=true;logPush(s,'⚠️ Mốc 02:00: chưa thể tự chuyển P5 vì còn thiếu giá thầu kín: '+calc.missing.join(', ')+'.');return true}return false}s.timer.autoPassed.P5=true;s.timer.autoBlockedP5=false;s.results=s.results.filter(r=>r.round!==s.round).concat(calc.results);s.phase='P6';logPush(s,'⏱ Mốc 02:00: tự giải quyết dự án và chuyển P5 → P6.');return true}
  if(phase==='P6'){s.timer.autoPassed.P6=true;settleProjectsCore(s);logPush(s,'⏱ Mốc 01:30: tự thanh toán và chuyển P6 → P7.');return true}
  return false
}
function timerTick(){
  let s=load(),rem=remainingTime(s),changed=false;
  document.querySelectorAll('#timerText').forEach(el=>{el.textContent=fmtTime(rem);el.classList.toggle('expired',rem<=0)});
  document.querySelectorAll('.game-elapsed').forEach(el=>{if(!el.id){const running=!!(s.timer?.running&&!s.gameOver);el.textContent=(running?'⏱':'⏸')+' REALTIME '+fmtElapsed(elapsedSeconds(s));el.classList.toggle('running',running);el.classList.toggle('paused',!running)}});
  const setupEl=document.getElementById('setupElapsedText');if(setupEl){const running=!!(s.timer?.running&&!s.gameOver);setupEl.textContent=(running?'⏱':'⏸')+' REALTIME '+fmtElapsed(elapsedSeconds(s));setupEl.classList.toggle('running',running);setupEl.classList.toggle('paused',!running);const box=setupEl.closest('.setup-start');if(box)box.classList.toggle('paused',!running)}
  // Multiplayer authority: only Host mutates timed economy / auto phase transitions.
  // Player and Observer still render the same countdown locally from the shared endAt timestamp.
  if(ROOM?.id && session?.role!=='host')return;
  if(processRealtimeEconomy(s,Date.now()))changed=true;
  if(autoAdvanceByCountdown(s,rem))changed=true;
  if(s.timer.running&&rem<=0){pauseGameClock(s);s.timer.running=false;s.timer.remaining=0;s.timer.endAt=null;s.timer.expired=true;s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed.P7=true;if(s.phase!=='P7'){s.phase='P7'}expireOpenTrades(s,s.round);logPush(s,`⏱️ 00:00 Vòng ${s.round}: dừng đồng hồ tại P7. Host vẫn quyết định chơi thị trường tiếp theo hay tổng kết.`);changed=true}
  if(changed){save(s);render()}
}

const _sendCounterOfferV42=sendCounterOffer;
sendCounterOffer=async function(name,id,newPrice,message=''){const s=load(),t=s.trades.find(x=>x.id===id);if(!t)return;const role=tradeParties(t,name).buyer===name?'MUA':'BÁN';if(!confirm(`Xác nhận gửi thương lượng ${role}?\\nGiá mới: ${Number(newPrice)||0}M${String(message||'').trim()?`\\nTin nhắn: ${String(message).trim()}`:''}\\n\\nOK = CÓ, Cancel = KHÔNG.`))return;return _sendCounterOfferV42(name,id,newPrice,message)};

sendTradeOffer=async function(name){
  const s=load();if(s.phase!=='P3')return;persistTradeDraft(name);const d=tradeDraft(name,s),kind=d.kind,target=d.to,res=d.res,qty=d.qty,price=d.money,message=String(d.message||'').trim(),actor=s.players[name];
  if(kind==='buy'&&actor.money<price){alert('Bạn không đủ tiền cho đề nghị mua này.');return}if(kind==='sell'&&(actor.res[res]||0)<qty){alert('Bạn không đủ tài nguyên để bán.');return}
  const verb=kind==='buy'?'MUA':'BÁN',who=target==='ALL'?'TẤT CẢ':target;if(!confirm(`XÁC NHẬN GỬI ${verb}?\\n${RES[res].icon} ${RES[res].label} ×${qty}\\nĐối tác: ${who}\\nTổng giá: ${price}M${message?`\\nTin nhắn: ${message}`:''}\\n\\nOK = CÓ, Cancel = KHÔNG.`))return;
  const id=s.seq++,all=target==='ALL',trade={schema:2,id,rootId:id,round:s.round,mode:all?'all':'direct',originType:kind,initiator:name,target:all?'ALL':target,res,qty,price,proposer:name,recipient:all?null:target,buyer:kind==='buy'?name:(all?null:target),seller:kind==='sell'?name:(all?null:target),stage:'root',status:'pending',responses:{},branchWith:all?null:target,createdAt:Date.now(),message};
  s.trades.push(trade);logPush(s,`${name} gửi #${id} ${verb} ${RES[res].label} ×${qty} ${all?'cho ALL':`với ${target}`} · ${price}M.`);save(s);render()
};

function eligibleProjectContenders(s,pid){const pr=projectById(s,pid);if(!pr)return[];return Object.entries(s.players).filter(([,pl])=>pl.locked&&pl.target===pid&&enough(pl,pr.need)).map(([n])=>n)}
function auctionState(s,pid){return s.p5Auctions?.[String(s.round)]?.[pid]||null}
function ensureAuctionStateRoot(s){s.p5Auctions=s.p5Auctions||{};s.p5Auctions[String(s.round)]=s.p5Auctions[String(s.round)]||{};return s.p5Auctions[String(s.round)]}
function hostP5AuctionPanel(s){const contested=projects(s).map(pr=>({pr,parts:eligibleProjectContenders(s,pr.id)})).filter(x=>x.parts.length>1);if(!contested.length)return`<div class="auction-panel"><b>⚔️ Kiểm tra cạnh tranh</b><div class="auction-wait">Không có dự án nào có từ 2 người cùng đủ điều kiện.</div></div>`;return`<div class="auction-panel"><div class="split"><b>⚔️ ĐẤU GIÁ THẦU KÍN</b><span class="badge">${contested.length} dự án</span></div>${contested.map(({pr,parts})=>{const a=auctionState(s,pr.id);return`<div class="auction-row"><div class="split"><div><b>${pr.id} · ${pr.name}</b><div class="tiny muted">${parts.map(esc).join(' ↔ ')}</div></div>${a?`<span class="badge auction-open">ĐANG MỞ</span>`:`<button class="btn warn openAuctionBtn" data-project="${pr.id}">MỞ ĐẤU GIÁ</button>`}</div>${a?`<div class="auction-wait">Vòng giá #${a.bidRound||1} · ${a.participants.map(esc).join(' · ')}</div>`:''}</div>`}).join('')}</div>`}
hostPrimaryAction=function(s){if(s.phase==='P4')return`<div class="notice" style="margin-top:10px">Mỗi người phải CHỐT hoặc TỪ CHỐI dự án.</div>`;if(s.phase==='P5')return`${hostP5AuctionPanel(s)}<button class="btn warn big" id="resolveBtn" style="margin-top:10px">KIỂM TRA & CHỐT KẾT QUẢ P5</button>`;if(s.phase==='P6')return`<button class="btn good big" id="settleBtn" style="margin-top:10px">THỰC HIỆN THANH TOÁN</button>`;if(s.phase==='P7'){if(s.round>=5)return`<div class="market-decision"><button class="btn good big" id="finishGameBtn">🏆 TỔNG KẾT & VINH DANH</button></div>`;return`<div class="market-decision"><div class="market-decision-grid"><button class="btn good big" id="nextRoundBtn">▶ THỊ TRƯỜNG ${s.round+1}</button><button class="btn finish big" id="finishGameBtn">🏆 DỪNG & TỔNG KẾT</button></div></div>`}return''};

async function openSealedAuction(pid){if(!accessIsAdmin()||!ROOM?.id)return;const s=load(),parts=eligibleProjectContenders(s,pid);if(parts.length<2){alert('Không còn đủ 2 người cạnh tranh.');return}const {data,error}=await SB.rpc('open_project_auction_admin',{p_admin_token:ADMIN_TOKEN,p_room_id:ROOM.id,p_round:s.round,p_project_id:pid,p_participants:parts});if(error)throw error;const row=Array.isArray(data)?data[0]:data,root=ensureAuctionStateRoot(s);root[pid]={participants:row?.participants||parts,status:'open',bidRound:Number(row?.bid_round)||1};logPush(s,`Host mở đấu giá kín ${pid} cho ${root[pid].participants.join(', ')}.`);save(s);render()}

bidCard=function(name,s){
  const p=s.players[name];if(p.declinedProject)return`<div class="card"><div class="danger">Bạn đã từ chối dự án.</div></div>`;if(!p.locked||!p.target)return`<div class="card"><div class="danger">Bạn chưa chốt dự án.</div></div>`;
  const pr=projectById(s,p.target),parts=eligibleProjectContenders(s,p.target);if(!enough(p,pr.need))return`<div class="card"><div class="danger">Bạn không đủ tài nguyên.</div></div>`;if(parts.length<=1)return`<div class="card"><div class="success">Bạn đủ điều kiện và không có đối thủ.</div></div>`;
  const a=auctionState(s,p.target);if(!a||!a.participants.includes(name))return`<div class="card"><div class="notice">⏳ Chờ Host mở đấu giá kín cho <b>${p.target}</b>.</div></div>`;
  const submitted=auctionSubmittedLocal(name,s,p.target,a.bidRound);return`<div class="card"><div class="title">⚔️ Đấu giá kín — ${p.target}</div><div class="sealed-bid-note">Giá của bạn được lưu riêng ở server. Bạn không thấy giá đối thủ và đối thủ không thấy giá của bạn.</div>${submitted?`<div class="success">✅ Đã gửi giá kín vòng #${a.bidRound}. Chờ Host.</div>`:`<div class="field"><label>Giá thầu bí mật (M)</label><input id="bidAmount" type="number" min="0" max="${p.money}" value="${readUiDraft(name,s).bidAmount??0}"></div><button class="btn warn big" id="submitBid">GỬI GIÁ THẦU KÍN</button>`}</div>`
};
async function submitSealedBid(name){const s=load(),p=s.players[name],a=auctionState(s,p.target);if(!a||!ROOM?.id)return;const amount=Math.max(0,Number(document.getElementById('bidAmount')?.value)||0);if(amount>p.money){alert('Bạn không đủ tiền.');return}if(!confirm(`Xác nhận gửi giá thầu kín ${amount}M cho ${p.target}?\\nSau khi gửi không thể sửa trong vòng giá này.`))return;const {error}=await SB.rpc('submit_project_auction_bid',{p_room_id:ROOM.id,p_round:s.round,p_project_id:p.target,p_bid:amount,...negotiationRpcAuth(name)});if(error){if(String(error.message||'').includes('BID_ALREADY_SUBMITTED')){setAuctionSubmittedLocal(name,s,p.target,a.bidRound,true);render();return}throw error}setAuctionSubmittedLocal(name,s,p.target,a.bidRound,true);logPush(s,`${name} đã gửi giá thầu kín cho ${p.target}.`);save(s);render()}

resolveProjects=async function(){
  const s=load();if(s.phase!=='P5')return;const out=[];
  for(const pr of projects(s)){const parts=eligibleProjectContenders(s,pr.id);if(!parts.length){out.push({round:s.round,projectId:pr.id,winner:null,bid:0});continue}if(parts.length===1){out.push({round:s.round,projectId:pr.id,winner:parts[0],bid:0});continue}const a=auctionState(s,pr.id);if(!a){alert(`Hãy MỞ ĐẤU GIÁ cho ${pr.id} trước.`);return}const {data,error}=await SB.rpc('resolve_project_auction_admin',{p_admin_token:ADMIN_TOKEN,p_room_id:ROOM.id,p_round:s.round,p_project_id:pr.id});if(error){alert(error.message||error);return}const row=Array.isArray(data)?data[0]:data;if(row.status==='waiting'){alert(`${pr.id} còn thiếu giá của: ${(row.missing_players||[]).join(', ')}`);return}if(row.status==='tie_rebid'){const root=ensureAuctionStateRoot(s);root[pr.id]={participants:row.participants||[],status:'open',bidRound:Number(row.bid_round)||((a.bidRound||1)+1)};logPush(s,`${pr.id} hòa giá cao nhất. Yêu cầu đấu lại kín vòng #${root[pr.id].bidRound}.`);save(s);render();alert(`${pr.id} hòa giá. Các bên hòa sẽ gửi lại giá kín.`);return}out.push({round:s.round,projectId:pr.id,winner:row.winner,bid:Number(row.winning_bid)||0})}
  s.results=s.results.filter(r=>r.round!==s.round).concat(out);logPush(s,`Host chốt kết quả P5 Vòng ${s.round}.`);s.phase='P6';s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed.P5=true;save(s);render()
};

const _autoAdvanceByCountdownV42=autoAdvanceByCountdown;
autoAdvanceByCountdown=function(s,rem){if(s.phase==='P5'){if(!s.timer?.running)return false;s.timer.autoPassed=s.timer.autoPassed||{};if(rem<=AUTO_PHASE_THRESHOLDS.P5&&!s.timer.autoBlockedP5){s.timer.autoBlockedP5=true;logPush(s,'⚠️ Mốc P5: chờ Host xử lý đấu giá kín trước khi sang P6.');return true}return false}return _autoAdvanceByCountdownV42(s,rem)};

const START_MONEY_DEFAULT_V44=80;
const _normalizeSetupV44Base=normalizeSetup;
normalizeSetup=function(x){
  const y=_normalizeSetupV44Base(x);
  y.players=(y.players||[]).map(p=>({...p,money:Number.isFinite(Number(p.money))?Math.max(0,Math.round(Number(p.money))):START_MONEY_DEFAULT_V44}));
  return y
};

const _initialStateV44Base=initialState;
initialState=function(setup=loadSetup()){
  setup=normalizeSetup(setup);
  const s=_initialStateV44Base(setup);
  for(const e of setup.players||[]){if(s.players?.[e.name])s.players[e.name].money=Number.isFinite(Number(e.money))?Math.max(0,Math.round(Number(e.money))):START_MONEY_DEFAULT_V44}
  s.setup=deep(setup);
  return s
};

const _setupViewV44Base=setupView;
setupView=function(){
  const html=_setupViewV44Base(),setup=normalizeSetup(loadSetup()),box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('[data-setup-row]').forEach((row,i)=>{
    const p=setup.players[i]||{},field=document.createElement('div');field.className='field setup-money-field';field.style.margin='0';
    field.innerHTML=`<label>Tiền đầu game (M)</label><input class="setupMoney" data-i="${i}" type="number" min="0" step="1" value="${Number.isFinite(Number(p.money))?Math.max(0,Math.round(Number(p.money))):START_MONEY_DEFAULT_V44}"><div class="setup-business-note">Mặc định ${START_MONEY_DEFAULT_V44}M nếu Host không đổi.</div>`;
    row.appendChild(field)
