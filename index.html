const _bindSetupV44Base=bindSetup;
bindSetup=function(){
  _bindSetupV44Base();
  const saveBtn=document.getElementById('saveSetupBtn');
  if(!saveBtn)return;
  saveBtn.onclick=()=>{
    const cfg=loadSetup(),countEl=document.getElementById('setupCount'),raw=String(countEl?.value||'').trim(),n=Number(raw),
      names=[...document.querySelectorAll('.setupName')].slice(0,n).map(x=>x.value.trim()),
      biz=[...document.querySelectorAll('.setupBiz')].slice(0,n).map(x=>x.value),
      money=[...document.querySelectorAll('.setupMoney')].slice(0,n).map(x=>String(x.value).trim()===''?START_MONEY_DEFAULT_V44:Math.max(0,Math.round(Number(x.value)||0))),
      branchEnabled=!!document.querySelector('.branchToggle[data-value="yes"].selected'),
      branchPrice=Math.max(0,Math.round(Number(document.getElementById('branchStartPrice')?.value)||0)),
      err=document.getElementById('setupError'),fail=msg=>{if(err){err.textContent=msg;err.classList.remove('hidden')}};
    if(err)err.classList.add('hidden');
    if(!cfg.startedAt)return fail('Hãy bấm “BẮT ĐẦU THIẾT LẬP GAME” trước khi tạo ván.');
    if(raw===''||!Number.isInteger(n)||n<3||n>20)return fail('Số người chơi phải là số nguyên từ 3 đến 20.');
    if(names.some(x=>!x))return fail('Mỗi người chơi phải có tên.');
    if(new Set(names.map(x=>x.toLocaleLowerCase('vi'))).size!==names.length)return fail('Tên người chơi không được trùng nhau.');
    if(new Set(biz).size!==biz.length)return fail('Mỗi người cần một loại doanh nghiệp khác nhau.');
    const next={players:names.map((name,i)=>({name,businessId:biz[i],money:money[i]})),branchEnabled,branchStartPrice:branchPrice,startedAt:cfg.startedAt};
    saveSetup(next);save(initialState(next));logout()
  }
};

const _activeElapsedMsNowV45Old=activeElapsedMsNow;
const _normalizeStateV45Base=normalizeState;
normalizeState=function(s){
  s=_normalizeStateV45Base(s);
  if(!s.realtimeClockV45){
    let carry=0;try{carry=Math.max(0,Number(_activeElapsedMsNowV45Old(s))||0)}catch(e){}
    s.realtimeClock={running:false,elapsedMs:carry,startedAt:null};s.realtimeClockV45=true;
  }
  if(!s.realtimeClock)s.realtimeClock={running:false,elapsedMs:0,startedAt:null};
  if(!Number.isFinite(Number(s.realtimeClock.elapsedMs)))s.realtimeClock.elapsedMs=0;
  if(typeof s.realtimeClock.running!=='boolean')s.realtimeClock.running=false;
  if(!('startedAt' in s.realtimeClock))s.realtimeClock.startedAt=null;
  if(s.realtimeClock.running&&!s.realtimeClock.startedAt)s.realtimeClock.startedAt=Date.now();
  for(const p of Object.values(s.players||{})){
    if(!Array.isArray(p.promoCodes))p.promoCodes=[];

  }

};

defaultTimer=function(){return{duration:V45_ROUND_SECONDS,remaining:V45_ROUND_SECONDS,endAt:null,running:false,expired:false,autoPassed:{}}};
remainingTime=function(s){if(!s.timer)return V45_ROUND_SECONDS;if(s.timer.running&&s.timer.endAt)return Math.max(0,Math.ceil((s.timer.endAt-Date.now())/1000));return Math.max(0,s.timer.remaining??s.timer.duration??V45_ROUND_SECONDS)};

processRealtimeEconomy=function(s,now=Date.now()){
  if(!s||s.gameOver||!s.realtimeClock?.running)return false;let changed=false;
  const activeNow=activeElapsedMsNow(s,now);
  if(s.branchMarket?.enabled){
    if(!s.branchMarket.frozen&&s.branchMarket.price>0){const base=Math.max(0,Number(s.branchMarket.lastPriceBumpActiveMs)||0),steps=Math.floor((activeNow-base)/BRANCH_PRICE_STEP_MS);if(steps>0){s.branchMarket.price+=steps*BRANCH_PRICE_STEP;s.branchMarket.lastPriceBumpActiveMs=base+steps*BRANCH_PRICE_STEP_MS;logPush(s,`🏪 Giá chi nhánh tự tăng +${steps*BRANCH_PRICE_STEP}M → ${s.branchMarket.price}M/chi nhánh.`);changed=true}}
    for(const [name,p] of Object.entries(s.players||{}))for(const b of p.branches||[]){const own=b.res===p.businessId,period=own?60000:180000,perCycle=own?(Number(b.count)||0):(Math.floor((Number(b.count)||0)/3)*2);if(perCycle<=0)continue;const boughtAtActive=Math.max(0,Number(b.boughtAtActiveMs)||0),cycles=Math.floor(Math.max(0,activeNow-boughtAtActive)/period),credited=Number(b.cyclesCredited)||0;if(cycles>credited){const add=(cycles-credited)*perCycle;p.res[b.res]=(p.res[b.res]||0)+add;b.cyclesCredited=cycles;logPush(s,`🏭 Chi nhánh của ${name} tạo +${add} ${RES[b.res]?.icon||''} ${RES[b.res]?.label||b.res}.`);changed=true}}
  }
  return changed
};

// 3–4) New branch rule:
// core branch = base price, +1 resource / minute / branch.
// non-core branch = 3x base price PER branch, +2 resources / 3 minutes / branch.
// Track cumulative production in b.produced so the owner can see branch/profit count.
const _normalizeStateV46Base=normalizeState;
normalizeState=function(s){
  s=_normalizeStateV46Base(s);
  for(const p of Object.values(s.players||{})){
    for(const b of p.branches||[]){
      const count=Math.max(0,Number(b.count)||0),own=b.res===p.businessId,perCycle=own?count:count*2;
      if(!Number.isFinite(Number(b.cyclesCredited)))b.cyclesCredited=0;
      if(!Number.isFinite(Number(b.produced)))b.produced=Math.max(0,(Number(b.cyclesCredited)||0)*perCycle)
    }
  }
  return s
};

function branchStatsV46(p){
  const out={};
  for(const b of p.branches||[]){
    if(!out[b.res])out[b.res]={count:0,produced:0};
    out[b.res].count+=Math.max(0,Number(b.count)||0);
    out[b.res].produced+=Math.max(0,Number(b.produced)||0)
  }
  return out
}

processRealtimeEconomy=function(s,now=Date.now()){
  if(!s||s.gameOver||!s.realtimeClock?.running)return false;let changed=false;
  const activeNow=activeElapsedMsNow(s,now);
  if(s.branchMarket?.enabled){
    if(!s.branchMarket.frozen&&s.branchMarket.price>0){const base=Math.max(0,Number(s.branchMarket.lastPriceBumpActiveMs)||0),steps=Math.floor((activeNow-base)/BRANCH_PRICE_STEP_MS);if(steps>0){s.branchMarket.price+=steps*BRANCH_PRICE_STEP;s.branchMarket.lastPriceBumpActiveMs=base+steps*BRANCH_PRICE_STEP_MS;logPush(s,`🏪 Giá chi nhánh tự tăng +${steps*BRANCH_PRICE_STEP}M → ${s.branchMarket.price}M/chi nhánh.`);changed=true}}
    for(const [name,p] of Object.entries(s.players||{}))for(const b of p.branches||[]){
      const own=b.res===p.businessId,count=Math.max(0,Number(b.count)||0),period=own?60000:180000,perCycle=own?count:count*2;if(perCycle<=0)continue;
      const boughtAtActive=Math.max(0,Number(b.boughtAtActiveMs)||0),cycles=Math.floor(Math.max(0,activeNow-boughtAtActive)/period),credited=Math.max(0,Number(b.cyclesCredited)||0);
      if(!Number.isFinite(Number(b.produced)))b.produced=credited*perCycle;
      if(cycles>credited){const add=(cycles-credited)*perCycle;p.res[b.res]=(p.res[b.res]||0)+add;b.cyclesCredited=cycles;b.produced=Math.max(0,Number(b.produced)||0)+add;logPush(s,`🏭 Chi nhánh của ${name} tạo +${add} ${RES[b.res]?.icon||''} ${RES[b.res]?.label||b.res}.`);changed=true}
    }
  }
  return changed
};

  const out=deep(latest),names=new Set([...Object.keys(local.players||{}),...Object.keys(base.players||{})]);
  for(const name of names){const bp=base.players?.[name],lp=local.players?.[name],rp=out.players?.[name];if(!bp||!lp||!rp)continue;
    if(Number.isFinite(Number(lp.money))&&Number.isFinite(Number(bp.money)))rp.money=(Number(rp.money)||0)+(Number(lp.money)-Number(bp.money));
    rp.res=rp.res||{};for(const k of new Set([...Object.keys(bp.res||{}),...Object.keys(lp.res||{})])){const delta=(Number(lp.res?.[k])||0)-(Number(bp.res?.[k])||0);if(delta)rp.res[k]=(Number(rp.res[k])||0)+delta}
    for(const k of ['target','locked','declinedProject','bid','joined','promoSelectedId'])if(JSON.stringify(lp[k])!==JSON.stringify(bp[k]))rp[k]=deep(lp[k]);

/* On first focus, put the insertion caret after the existing value. Selects are

function placeCaretAtEndV472(el){

function buildTradeAdviceSnapshotV473(s){
  const players={},demand=zeroRes(),valueWeight=zeroRes();
  for(const [name,p] of Object.entries(s.players||{})){
    const pr=p.target?projectById(s,p.target):null,need=pr?deep(pr.need):zeroRes();
    if(pr){const units=Math.max(1,sumRes(need)),unitShare=Math.max(5,(Number(pr.reward)||0)/units*.45);for(const k of RESOURCE_KEYS){const qty=Number(need[k])||0;demand[k]=(demand[k]||0)+qty;valueWeight[k]=(valueWeight[k]||0)+unitShare*qty}}
    players[name]={businessId:p.businessId||null,company:p.company||'',projectId:pr?.id||null,projectName:pr?.name||'',reward:Number(pr?.reward)||0,need};
  }
  /* Price anchors use only public P2 project requirements/rewards. They never
     inspect another player's private inventory. */
  const prices=Object.fromEntries(RESOURCE_KEYS.map(k=>[k,demand[k]>0?roundHalf(clamp(valueWeight[k]/demand[k],5,50)):10]));
  return{schema:1,round:s.round,capturedAt:Date.now(),generation:Number(s.tradeAdviceP2V473?.generation||0)+1,players,prices,demand};
}
function tradeAdviceNeedsCaptureV473(s){return !s.tradeAdviceP2V473||Number(s.tradeAdviceP2V473.round)!==Number(s.round)||!!s.tradeAdviceRefreshPendingV473}

function tradeAdvicePriceBandV473(snap,res,qty,mode,preferredStrength=false,reward=0){
  const unit=Math.max(1,Number(snap.prices?.[res])||10),count=Math.max(1,Object.values(snap.players||{}).filter(x=>x.projectId).length),pressure=Math.min(.28,(Number(snap.demand?.[res])||0)/count*.06),total=unit*Math.max(1,qty);
  let low,high;
  if(mode==='sell'){
    const rewardLift=Math.min(.12,Math.max(0,Number(reward)||0)/1200);low=ceil5(total*(.92+pressure+rewardLift));high=ceil5(total*(1.16+pressure+rewardLift));
  }else{
    low=ceil5(total*(preferredStrength?.78:.90));high=ceil5(total*(preferredStrength?1.02:1.16));
  }
  low=Math.max(5,low);high=Math.max(low+5,high);return{low,high,mid:(low+high)/2,unit}
}
function tradeAdviceDataV473(name,s){
  const snap=tradeAdviceSnapshotV473(s),me=s.players?.[name],mine=snap.players?.[name];if(!me||!mine)return{snap,sales:[],buys:[]};
  const ownNeed=mine.projectId?mine.need||{}:{},remaining=Object.fromEntries(RESOURCE_KEYS.map(k=>[k,Math.max(0,(Number(me.res?.[k])||0)-(Number(ownNeed[k])||0))]));
  const rawSales=[];
  for(const [buyer,bp] of Object.entries(snap.players||{})){
    if(buyer===name||!bp.projectId)continue;
    for(const k of RESOURCE_KEYS){const need=Math.max(0,Number(bp.need?.[k])||0),have=remaining[k]||0;if(!need||!have)continue;
      const qty=Math.min(need,have),band=tradeAdvicePriceBandV473(snap,k,qty,'sell',false,bp.reward),buyerOwn=bp.businessId===k;
      const score=band.mid*(buyerOwn?.68:1.12)+(me.businessId===k?8:0)+(Number(bp.reward)||0)/30+need*2;
      rawSales.push({buyer,bp,res:k,need,qty,band,score,buyerOwn})
    }
  }
  rawSales.sort((a,b)=>b.score-a.score||b.band.high-a.band.high||a.buyer.localeCompare(b.buyer,'vi'));
  const sales=[];for(const x of rawSales){const qty=Math.min(x.need,remaining[x.res]||0);if(!qty)continue;const band=tradeAdvicePriceBandV473(snap,x.res,qty,'sell',false,x.bp.reward);sales.push({...x,qty,band});remaining[x.res]-=qty;if(sales.length>=6)break}
  const buys=[];
  if(mine.projectId){
    for(const k of RESOURCE_KEYS){const need=Math.max(0,Number(mine.need?.[k])||0),short=Math.max(0,need-(Number(me.res?.[k])||0));if(!short)continue;
      const ownerEntry=Object.entries(snap.players||{}).find(([other,op])=>other!==name&&op.businessId===k),owner=ownerEntry?.[0]||null,op=ownerEntry?.[1]||null,preferred=!!owner;
      const band=tradeAdvicePriceBandV473(snap,k,short,'buy',preferred,mine.reward),urgency=need?short/need:0,score=urgency*100+band.unit*short+(preferred?12:0);
      buys.push({res:k,qty:short,owner,op,band,score,preferred})

  }
  return{snap,sales,buys}
}

function projectChoiceLimitV475(s){const count=Object.keys(s.players||{}).length,available=projects(s).length;return Math.max(1,Math.min(available,s.round<=1?1:Math.ceil(count*.70)))}

function p2TargetsV475(p,s){return uniqProjectIdsV475(Array.isArray(p?.p2Targets)?p.p2Targets:playerTargetsV475(p,s),s)}
function setPlayerTargetsV475(p,ids,s){p.targets=uniqProjectIdsV475(ids,s).slice(0,projectChoiceLimitV475(s));p.target=p.targets[0]||null;p.locked=false;p.declinedProject=false;p.bid=null;p.projectDecisions={};return p.targets}

function syncLegacyProjectFieldsV475(p,s){const ids=playerTargetsV475(p,s);p.targets=ids;p.target=ids[0]||null;p.projectDecisions=p.projectDecisions&&typeof p.projectDecisions==='object'?p.projectDecisions:{};p.locked=ids.some(pid=>p.projectDecisions[pid]==='locked');p.declinedProject=ids.length>0&&!p.locked&&ids.every(pid=>['declined','ineligible'].includes(p.projectDecisions[pid]));return p}
function captureP2TargetsV475(s){for(const p of Object.values(s.players||{})){p.p2Targets=playerTargetsV475(p,s);p.p2TargetsRound=s.round}return s}

function emptyBankLoanV475(s,mode='minute'){
  return{active:false,status:'closed',mode:mode==='phase'?'phase':'minute',principal:0,balance:0,totalBorrowed:0,totalPaid:0,totalInterestAccrued:0,totalInterestPaid:0,totalCollateralLiquidated:0,lastMinuteIndex:Math.floor(activeElapsedMsNow(s)/BANK_MINUTE_MS_V475),lastRate:0,openedAt:null,closedAt:null,history:[]}
}
function normalizeBankLoanV475(p,s){
  const mode=p?.bankLoan?.mode==='phase'?'phase':'minute',d={...emptyBankLoanV475(s,mode),...(p?.bankLoan||{})};
  for(const k of ['principal','balance','totalBorrowed','totalPaid','totalInterestAccrued','totalInterestPaid','totalCollateralLiquidated','lastRate'])d[k]=Math.max(0,Number(d[k])||0);
  d.active=d.status==='active'||d.balance>0;d.status=p?.bankrupt?'defaulted':d.active?'active':(d.status==='defaulted'?'defaulted':'closed');d.mode=mode;d.history=Array.isArray(d.history)?d.history.slice(-20):[];
  if(!Number.isFinite(Number(d.lastMinuteIndex)))d.lastMinuteIndex=Math.floor(activeElapsedMsNow(s)/BANK_MINUTE_MS_V475);p.bankLoan=d;return d
}

const _normalizeStateV475Base=normalizeState;

  if(!s.bank||typeof s.bank!=='object')s.bank={};s.bank.enabled=typeof s.bank.enabled==='boolean'?s.bank.enabled:!!s.setup.loanEnabled;s.bank.defaultMode=s.bank.defaultMode==='phase'?'phase':(s.setup.loanDefaultMode==='phase'?'phase':'minute');s.bank.schema=1;

computeRoundResolution=function(s){
  const out=[];for(const pr of projects(s)){const names=eligibleProjectContenders(s,pr.id);if(!names.length){out.push({round:s.round,projectId:pr.id,winner:null,bid:0,payout:0,competitive:false,solo:false,competitors:[]});continue}if(names.length===1){out.push({round:s.round,projectId:pr.id,winner:names[0],bid:0,payout:Number(pr.reward)||0,competitive:false,solo:true,competitors:names});continue}const rows=names.map(n=>[n,Number(s.players[n]?.projectBids?.[pr.id])]).filter(([,v])=>Number.isFinite(v));if(rows.length<names.length)return{ok:false,missing:names.filter(n=>!rows.some(([x])=>x===n))};const low=Math.min(...rows.map(([,v])=>v)),tied=rows.filter(([,v])=>v===low);if(tied.length>1)return{ok:false,missing:tied.map(([n])=>n),tie:true,projectId:pr.id};out.push({round:s.round,projectId:pr.id,winner:tied[0][0],bid:low,payout:low,competitive:true,solo:false,competitors:names})}return{ok:true,results:out}
};

resolveProjects=async function(){

  for(const pr of projects(s)){

    const a=auctionState(s,pr.id);if(!a){alert(`Hãy MỞ ĐẤU THẦU cho ${pr.id} trước.`);return}if(!ROOM?.id){alert('Đấu thầu kín cần phòng online.');return}

    if(row?.status==='waiting'){alert(`${pr.id} còn thiếu giá của: ${(row.missing_players||[]).join(', ')}`);return}
    if(row?.status==='tie_rebid'){const root=ensureAuctionStateRoot(s);root[pr.id]={participants:row.participants||[],status:'open',bidRound:Number(row.bid_round)||((a.bidRound||1)+1)};logPush(s,`${pr.id} hòa giá thấp nhất. Các bên hòa đấu lại vòng #${root[pr.id].bidRound}.`);save(s);render();alert(`${pr.id} hòa giá thấp nhất. Các bên hòa sẽ gửi lại giá kín.`);return}
    const bid=Number(row?.winning_bid)||0;out.push({round:s.round,projectId:pr.id,winner:row?.winner||null,bid,payout:bid,competitive:true,solo:false,competitors:parts})
  }
  s.results=(s.results||[]).filter(r=>r.round!==s.round).concat(out);applyPhaseInterestV475(s,'P5','P6');s.phase='P6';s.timer.autoPassed=s.timer.autoPassed||{};s.timer.autoPassed.P5=true;logPush(s,`Host chốt kết quả P5: giá chào hợp lệ thấp nhất thắng.`);save(s);render()

settleProjectsCore=function(s){
  if(s.settledRound===s.round)return false;const promoUsed=new Set();
  for(const r of (s.results||[]).filter(x=>x.round===s.round&&x.winner)){
    const pr=projectById(s,r.projectId),p=s.players[r.winner];if(!pr||!p||p.bankrupt||!enough(p,pr.need))continue;for(const [k,v] of Object.entries(pr.need))p.res[k]-=v;
    const base=resultBasePayoutV475(r,s);let pct=0,code=null;if(!promoUsed.has(r.winner)&&p.promoSelectedId){code=(p.promoCodes||[]).find(c=>c.id===p.promoSelectedId&&c.status==='available');if(code)pct=Math.max(0,Number(code.percent)||0)}const payout=Math.round(base*(1+pct/100));p.money=roundMoneyV475((Number(p.money)||0)+payout);r.payout=base;r.paidAmount=payout;
    if(code){code.status='used';code.usedRound=s.round;code.usedProjectId=pr.id;code.usedAt=Date.now();promoUsed.add(r.winner);logPush(s,`🎟️ ${r.winner} dùng ${code.id} +${pct}%: tiền nhận ${base}M → ${payout}M.`)}
    p.wins=p.wins||[];p.wins.push({round:s.round,projectId:r.projectId,reward:payout,bid:Number(r.bid)||0,payoutBase:base,competitive:!!r.competitive,promoPercent:pct,promoCode:code?.id||null});p.promoSelectedId=null
  }
  applyPhaseInterestV475(s,'P6','P7');s.settledRound=s.round;s.phase='P7';logPush(s,`Đã thanh toán Thị trường ${s.round}: dự án cạnh tranh trả đúng giá trúng thầu.`);return true
};

promoPreviewDataV474=function(name,s,value){

};

/* ---------- Ngân hàng Cơ: adaptive rates, collateral and bankruptcy ---------- */
function roundMoneyV475(x){return Math.round((Number(x)||0)*10)/10}
function bankPriceMapV475(s){const rows=currentMarketMetrics(s)?.rows||[];return Object.fromEntries(RESOURCE_KEYS.map(k=>[k,Math.max(1,Number(rows.find(x=>x.k===k)?.price)||10)]))}
function bankInventoryValueV475(s,p){const price=bankPriceMapV475(s);return roundMoneyV475(RESOURCE_KEYS.reduce((sum,k)=>sum+Math.max(0,Number(p?.res?.[k])||0)*price[k],0))}
function bankBalanceV475(p){return Math.max(0,Number(p?.bankLoan?.balance)||0)}
function bankEquityV475(s,p){return roundMoneyV475(Math.max(0,(Number(p?.money)||0)+bankInventoryValueV475(s,p)-bankBalanceV475(p)))}
function bankCapacityV475(s,p){const maxDebt=Math.floor(bankEquityV475(s,p)*.70),available=Math.max(0,maxDebt-bankBalanceV475(p));return{equity:bankEquityV475(s,p),maxDebt,available}}
function bankMarketStressV475(s){const rows=currentMarketMetrics(s)?.rows||[];if(!rows.length)return 1;const avg=rows.reduce((t,x)=>t+(Number(x.price)||10),0)/rows.length;return clamp(avg/10,.78,1.32)}
function bankInterestRateV475(s,mode){const crowd=clamp((Object.keys(s.players||{}).length-3)/17,0,1),stress=bankMarketStressV475(s);return mode==='phase'?clamp((.012+.008*crowd)*stress,.01,.026):clamp((.0024+.0012*crowd)*stress,.0018,.0048)}
function bankModeLabelV475(mode){return mode==='phase'?'Theo mỗi lần đổi P':'Theo phút realtime'}
function bankHistoryPushV475(loan,type,amount,note=''){loan.history=Array.isArray(loan.history)?loan.history:[];loan.history.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,at:Date.now(),type,amount:roundMoneyV475(amount),note});loan.history=loan.history.slice(-20)}
function bankResourceOrderV475(p){return RESOURCE_KEYS.filter(k=>(Number(p?.res?.[k])||0)>0).sort((a,b)=>(Number(p.res[b])||0)-(Number(p.res[a])||0)||a.localeCompare(b))}
function markBankruptV475(s,name,reason){const p=s.players?.[name];if(!p||p.bankrupt)return;p.bankrupt=true;p.targets=[];p.target=null;p.projectDecisions={};p.locked=false;p.declinedProject=true;const loan=normalizeBankLoanV475(p,s);loan.active=false;loan.status='defaulted';loan.closedAt=Date.now();bankHistoryPushV475(loan,'default',loan.balance,reason);logPush(s,`💥 ${name} bị tuyên bố PHÁ SẢN: ${reason}.`)}
function collectBankChargeV475(s,name,amount,kind='interest'){
  const p=s.players?.[name];if(!p||p.bankrupt)return{paid:0,liquidated:0};const loan=normalizeBankLoanV475(p,s),charge=Math.max(0,roundMoneyV475(amount));if(charge<=0)return{paid:0,liquidated:0};p.money=roundMoneyV475((Number(p.money)||0)-charge);let liquidated=0,guard=0;
  while(guard++<10000){const inventory=bankInventoryValueV475(s,p),negativeLimit=-roundMoneyV475(inventory*.30);if((Number(p.money)||0)>=negativeLimit)break;const key=bankResourceOrderV475(p)[0];if(!key)break;const value=bankPriceMapV475(s)[key]||10;p.res[key]=Math.max(0,(Number(p.res[key])||0)-1);p.money=roundMoneyV475((Number(p.money)||0)+value);liquidated=roundMoneyV475(liquidated+value)}
  if(liquidated>0){loan.totalCollateralLiquidated=roundMoneyV475(loan.totalCollateralLiquidated+liquidated);bankHistoryPushV475(loan,'collateral',liquidated,'Tự khấu trừ nguyên liệu từ tồn kho nhiều nhất')}
  const emptyAssets=bankResourceOrderV475(p).length===0,money=Number(p.money)||0;if(emptyAssets&&(money<0||(kind==='interest'&&money<=0&&loan.balance>0)))markBankruptV475(s,name,'Không còn tiền hoặc nguyên liệu để bảo đảm khoản nợ');return{paid:charge,liquidated}
}
function processMinuteBankInterestV475(s){
  if(!s.bank?.enabled)return false;const minute=Math.floor(activeElapsedMsNow(s)/BANK_MINUTE_MS_V475);let changed=false;
  for(const [name,p] of Object.entries(s.players||{})){const loan=normalizeBankLoanV475(p,s);if(!loan.active||loan.mode!=='minute'||p.bankrupt){loan.lastMinuteIndex=Math.max(Number(loan.lastMinuteIndex)||0,minute);continue}const previous=Math.max(0,Number(loan.lastMinuteIndex)||0),steps=Math.max(0,minute-previous);if(!steps)continue;const rate=bankInterestRateV475(s,'minute'),interest=roundMoneyV475(loan.balance*rate*steps);loan.lastMinuteIndex=minute;loan.lastRate=rate;loan.totalInterestAccrued=roundMoneyV475(loan.totalInterestAccrued+interest);const paid=collectBankChargeV475(s,name,interest,'interest');loan.totalInterestPaid=roundMoneyV475(loan.totalInterestPaid+paid.paid);bankHistoryPushV475(loan,'interest',interest,`${steps} phút · ${(rate*100).toFixed(2)}%/phút`);changed=true}
  return changed
}
function applyPhaseInterestV475(s,fromPhase,toPhase){
  if(!s?.bank?.enabled||fromPhase===toPhase)return false;let changed=false;

/* ---------- P2 snapshot and P3 advice now aggregate every P2 target ---------- */
buildTradeAdviceSnapshotV473=function(s){
  const players={},demand=zeroRes(),valueWeight=zeroRes();
  for(const [name,p] of Object.entries(s.players||{})){
    const ids=(Number(p.p2TargetsRound)===Number(s.round)&&Array.isArray(p.p2Targets)?p.p2Targets:playerTargetsV475(p,s)).filter(id=>projectById(s,id)),need=zeroRes();let reward=0;for(const id of ids){const pr=projectById(s,id);reward+=Number(pr?.reward)||0;for(const k of RESOURCE_KEYS)need[k]+=(Number(pr?.need?.[k])||0)}
    if(ids.length){const units=Math.max(1,sumRes(need)),unitShare=Math.max(5,reward/units*.45);for(const k of RESOURCE_KEYS){const qty=Number(need[k])||0;demand[k]=(demand[k]||0)+qty;valueWeight[k]=(valueWeight[k]||0)+unitShare*qty}}
    players[name]={businessId:p.businessId||null,company:p.company||'',projectId:ids.join(' · ')||null,projectIds:ids,projectName:ids.map(id=>projectById(s,id)?.name||id).join(' · '),reward,need}
  }
  const prices=Object.fromEntries(RESOURCE_KEYS.map(k=>[k,demand[k]>0?roundHalf(clamp(valueWeight[k]/demand[k],5,50)):10]));return{schema:2,round:s.round,capturedAt:Date.now(),generation:Number(s.tradeAdviceP2V473?.generation||0)+1,players,prices,demand}
};

const _rebasePlayerStateV475Base=rebasePlayerStateV47;
rebasePlayerStateV47=function(base,local,latest){
  const out=_rebasePlayerStateV475Base(base,local,latest);for(const name of Object.keys(local.players||{})){const bp=base.players?.[name],lp=local.players?.[name],rp=out.players?.[name];if(!bp||!lp||!rp)continue;
    for(const k of ['targets','p2Targets','p2TargetsRound','projectDecisions','bankrupt'])if(JSON.stringify(lp[k])!==JSON.stringify(bp[k]))rp[k]=deep(lp[k]);
    const bl=bp.bankLoan||emptyBankLoanV475(base),ll=lp.bankLoan||emptyBankLoanV475(local);if(JSON.stringify(bl)!==JSON.stringify(ll)){const rl=normalizeBankLoanV475(rp,out);for(const k of ['principal','balance','totalBorrowed','totalPaid','totalInterestAccrued','totalInterestPaid','totalCollateralLiquidated'])rl[k]=roundMoneyV475(Math.max(0,(Number(rl[k])||0)+(Number(ll[k])||0)-(Number(bl[k])||0)));for(const k of ['active','status','mode','openedAt','closedAt','lastRate'])if(JSON.stringify(ll[k])!==JSON.stringify(bl[k]))rl[k]=deep(ll[k]);rl.lastMinuteIndex=Math.max(Number(rl.lastMinuteIndex)||0,Number(ll.lastMinuteIndex)||0);const seen=new Set((rl.history||[]).map(x=>x.id));for(const h of ll.history||[])if(!(bl.history||[]).some(x=>x.id===h.id)&&!seen.has(h.id)){rl.history.push(deep(h));seen.add(h.id)}rl.history=rl.history.slice(-20)}
    syncLegacyProjectFieldsV475(rp,out)
  }return out
};

/* ---------- Ranking subtracts outstanding debt; bankrupt players always lose ---------- */
ranking=function(s){
  const rows=Object.entries(s.players||{}).map(([name,p])=>{const resCount=Object.values(p.res||{}).reduce((a,b)=>a+(Number(b)||0),0),resValue=liquidationValueV464(resCount),debt=bankBalanceV475(p),projectRevenue=(p.wins||[]).reduce((a,w)=>a+(Number(w.reward)||0),0),tradeCount=(s.trades||[]).filter(t=>t.status==='accepted'&&(t.buyer===name||t.seller===name||t.from===name||t.to===name)).length,total=Number(((Number(p.money)||0)+resValue-debt).toFixed(1));return{name,cash:Number(p.money)||0,resCount,resValue,total,wins:(p.wins||[]).length,projectRevenue,auctionCost:0,tradeCount,company:p.company,debt,bankrupt:!!p.bankrupt}}).sort((a,b)=>Number(a.bankrupt)-Number(b.bankrupt)||b.total-a.total||b.cash-a.cash||b.wins-a.wins||a.name.localeCompare(b.name,'vi'));
  let prevKey=null,prevRank=0;rows.forEach((r,i)=>{const key=`${r.bankrupt?'B':'A'}:${r.total}`;if(i===0||key!==prevKey)prevRank=i+1;r.rank=prevRank;prevKey=key});return rows
};
